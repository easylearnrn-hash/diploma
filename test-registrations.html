<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Registrations - Supabase</title>
  <style>
    body {
      font-family: 'Monaco', 'Courier New', monospace;
      background: #0a0a0a;
      color: #00ff00;
      padding: 40px;
      line-height: 1.6;
    }
    h1 {
      color: #00ffff;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
    }
    .section {
      background: #1a1a1a;
      border: 2px solid #00ff00;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      margin: 10px 10px 10px 0;
    }
    button:hover {
      background: #00cc00;
    }
    .error {
      color: #ff0000;
      background: #330000;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ff0000;
    }
    .success {
      color: #00ff00;
      background: #003300;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #00ff00;
    }
    pre {
      background: #000;
      border: 1px solid #00ff00;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      color: #00ffff;
    }
    .loading {
      color: #ffff00;
    }
  </style>
</head>
<body>
  <h1>🔍 Test Registrations Table</h1>
  
  <div class="section">
    <h2>Actions</h2>
    <button onclick="testConnection()">1. Test Supabase Connection</button>
    <button onclick="checkTable()">2. Check if Table Exists</button>
    <button onclick="loadRegistrations()">3. Load All Registrations</button>
    <button onclick="countRegistrations()">4. Count Registrations</button>
  </div>
  
  <div class="section">
    <h2>Results</h2>
    <div id="results">
      <p class="loading">Click a button above to start testing...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const resultsDiv = document.getElementById('results');

    function log(message, type = 'info') {
      const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'loading';
      resultsDiv.innerHTML += `<p class="${className}">${message}</p>`;
      console.log(message);
    }

    function clearResults() {
      resultsDiv.innerHTML = '';
    }

    // Make functions globally accessible
    window.testConnection = async function() {
      clearResults();
      log('Testing Supabase connection...', 'loading');
      
      try {
        const supabase = initSupabase();
        if (!supabase) {
          throw new Error('Supabase client failed to initialize');
        }
        
        log('✅ Supabase client initialized successfully!', 'success');
        log('URL: ' + SUPABASE_CONFIG.url, 'info');
        
        // Test a simple query
        const { data, error } = await supabase
          .from('applications')
          .select('id')
          .limit(1);
        
        if (error) {
          log('⚠️ Warning: ' + error.message, 'error');
        } else {
          log('✅ Connection test successful!', 'success');
        }
      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
      }
    }

    window.checkTable = async function() {
      clearResults();
      log('Checking if registrations table exists...', 'loading');
      
      try {
        const supabase = initSupabase();
        
        const { data, error } = await supabase
          .from('registrations')
          .select('id')
          .limit(1);
        
        if (error) {
          if (error.message.includes('does not exist')) {
            log('❌ Table does NOT exist!', 'error');
            log('Error: ' + error.message, 'error');
            log('', 'info');
            log('🔧 YOU NEED TO RUN THE SQL SETUP:', 'error');
            log('1. Go to: https://supabase.com/dashboard/project/zlvnxvrzotamhpezqedr/sql', 'info');
            log('2. Click "+ New Query"', 'info');
            log('3. Copy SQL from: SETUP-REGISTRATIONS-TABLE.md', 'info');
            log('4. Paste and click "Run"', 'info');
          } else {
            log('❌ Error checking table: ' + error.message, 'error');
          }
        } else {
          log('✅ Table EXISTS and is accessible!', 'success');
          log('Table is ready to use.', 'success');
        }
      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
      }
    }

    window.loadRegistrations = async function() {
      clearResults();
      log('Loading all registrations...', 'loading');
      
      try {
        const supabase = initSupabase();
        
        const { data, error } = await supabase
          .from('registrations')
          .select('*')
          .order('registration_date', { ascending: false });
        
        if (error) {
          log('❌ Error: ' + error.message, 'error');
          if (error.message.includes('does not exist')) {
            log('', 'info');
            log('The table needs to be created first. Click "2. Check if Table Exists" for instructions.', 'error');
          }
        } else {
          log(`✅ Found ${data.length} registration(s)`, 'success');
          
          if (data.length === 0) {
            log('', 'info');
            log('No registrations yet. Try submitting the registration form on the login page.', 'loading');
          } else {
            log('', 'info');
            log('Registrations:', 'success');
            resultsDiv.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
          }
        }
      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
      }
    }

    window.countRegistrations = async function() {
      clearResults();
      log('Counting registrations...', 'loading');
      
      try {
        const supabase = initSupabase();
        
        const { count, error } = await supabase
          .from('registrations')
          .select('*', { count: 'exact', head: true });
        
        if (error) {
          log('❌ Error: ' + error.message, 'error');
        } else {
          log(`✅ Total registrations: ${count}`, 'success');
        }
      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
      }
    }

    // Auto-run connection test on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => window.testConnection(), 500);
    });
  </script>
</body>
</html>
