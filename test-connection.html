<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Supabase Connection</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    .error { color: #f00; }
    .success { color: #0f0; }
    pre { background: #000; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Supabase Connection Test</h1>
  <div id="results"></div>

  <script>
    const results = document.getElementById('results');

    function log(msg, isError = false) {
      const div = document.createElement('div');
      div.className = isError ? 'error' : 'success';
      div.textContent = msg;
      results.appendChild(div);
      console.log(msg);
    }

    async function testConnections() {
      // Test OLD project
      log('Testing OLD project (zlvnxvrzotamhpezqedr)...');
      const oldClient = window.supabase.createClient(
        'https://zlvnxvrzotamhpezqedr.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsdm54dnJ6b3RhbWhwZXpxZWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4MTEzMTcsImV4cCI6MjA3ODM4NzMxN30.-IoSqKhDrA9NuG4j3GufIbfmodWqCoppEklE1nTmw38'
      );

      try {
        const { data, error, count } = await oldClient
          .from('applications')
          .select('id', { count: 'exact', head: true });
        
        if (error) {
          log(`OLD PROJECT ERROR: ${error.message}`, true);
          log(`Error details: ${JSON.stringify(error)}`, true);
        } else {
          log(`OLD PROJECT SUCCESS: Found ${count} applications ✓`);
        }
      } catch (e) {
        log(`OLD PROJECT EXCEPTION: ${e.message}`, true);
      }

      // Test NEW project
      log('\nTesting NEW project (eyhksbiceueoiamwnqpr)...');
      const newClient = window.supabase.createClient(
        'https://eyhksbiceueoiamwnqpr.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5aGtzYmljZXVlb2lhbXducXByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4NTIwOTAsImV4cCI6MjA4NDQyODA5MH0.1G3RZLKLJvIR8U9Cvmner3kUIxDtUfFYkHpzUUbnbq8'
      );

      try {
        const { data, error, count } = await newClient
          .from('applications')
          .select('id', { count: 'exact', head: true });
        
        if (error) {
          log(`NEW PROJECT ERROR: ${error.message}`, true);
          log(`Error details: ${JSON.stringify(error)}`, true);
        } else {
          log(`NEW PROJECT SUCCESS: Found ${count} applications ✓`);
        }
      } catch (e) {
        log(`NEW PROJECT EXCEPTION: ${e.message}`, true);
      }
    }

    testConnections();
  </script>
</body>
</html>
