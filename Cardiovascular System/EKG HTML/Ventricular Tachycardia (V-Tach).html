<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ventricular Tachycardia (V-Tach)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    canvas {
      width: 100vw;
      height: 110px;
      display: block;
    }
    .pause-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.55);
      color: #b7ffcf;
      font-size: 14px;
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pause-btn:hover { background: rgba(0, 0, 0, 0.75); }
    .pause-btn:active { transform: scale(0.96); }

    /* Magnifier overlay canvas */
    #mag {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>
<body>
<button id="pauseBtn" class="pause-btn" aria-label="Pause strip" title="Pause/Play">⏸</button>
<canvas id="c"></canvas>
<canvas id="mag"></canvas>
<script>
// ── 1. Setup ─────────────────────────────────────────────────────
const canvas = document.getElementById('c');

const DPR    = window.devicePixelRatio || 1;
const CH     = 110;
const VIEW_W = window.innerWidth;

const MM            = 3.78;
const STRIP_SECONDS = 6;
const CW    = VIEW_W;
const SPEED = CW / STRIP_SECONDS;

canvas.width  = Math.round(CW * DPR);
canvas.height = Math.round(CH * DPR);
canvas.style.width  = CW + 'px';
canvas.style.height = CH + 'px';

const ctx = canvas.getContext('2d', { alpha: false });
ctx.scale(DPR, DPR);

// ── 2. Constants ─────────────────────────────────────────────────
// V-Tach:
//   Rate: 180 bpm — fast, regular
//   No P waves
//   Wide bizarre QRS (≥ 0.12 sec) — originates in ventricle, abnormal conduction
//   QRS and T merge into one large wide complex — monomorphic
const HR    = 180;
const RR_S  = 60 / HR;
const RR_PX = RR_S * SPEED;
const BASE  = CH * 0.58;   // vertical centre of waveform
const GAIN  = 0.52;        // scaled so tallest peak fits inside 110px canvas

// ── 3. Monitor grid ───────────────────────────────────────────────
function drawGridStatic() {
  const sm = MM, lg = MM * 5;
  ctx.fillStyle = '#000b00';
  ctx.fillRect(0, 0, CW, CH);

  ctx.strokeStyle = 'rgba(0, 160, 0, 0.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= CW; x += sm) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }
  for (let y = 0; y <= CH; y += sm) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(0, 255, 120, 0.22)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= CW; x += lg) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }
  for (let y = 0; y <= CH; y += lg) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }
}

// ── 4. Waveform math ─────────────────────────────────────────────
function gauss(f, mu, sig, amp) {
  return amp * Math.exp(-0.5 * ((f - mu) / sig) ** 2);
}

function vtachV(f) {
  // V-Tach morphology:
  //   • No P wave — flat baseline at start
  //   • Wide slurred upstroke — slow rise from baseline (abnormal depolarisation)
  //   • Broad rounded peak (no sharp R spike — this is ventricular origin)
  //   • Slurred downstroke into deep S-like trough
  //   • T wave inverted or merged — discordant with QRS direction
  //   • Short flat return before next beat
  //
  // The entire QRS+T complex occupies ~60% of the RR cycle at this rate.
  // f = 0..1 = one full RR cycle

  let v = 0;

  // ── Wide bizarre QRS: broad slow upstroke ────────────────────
  // Slow rise starts at f=0.10, peaks broadly around f=0.30
  v += gauss(f, 0.28, 85/1000, 13.5);   // main broad R hump — wide and tall

  // Slurred notch on the upstroke (typical V-Tach aberrancy)
  v += gauss(f, 0.18, 30/1000, 3.8);    // early shoulder/slur on way up

  // Deep broad S wave / downstroke going well below baseline
  v += gauss(f, 0.44, 55/1000, -8.5);   // S-trough — wide negative deflection

  // ── Discordant T wave: inverted relative to QRS ───────────────
  // At 180 bpm the T wave is close to the next beat
  v += gauss(f, 0.68, 70/1000, -4.5);   // inverted T — discordant with tall R

  return v;
}

// ── 5. Bake waveform tile ─────────────────────────────────────────
const TILE_W = Math.round(RR_PX * 14);

const wfTile = new OffscreenCanvas(TILE_W, CH);
(function bakeWaveform() {
  const g = wfTile.getContext('2d');
  g.clearRect(0, 0, TILE_W, CH);

  g.beginPath();
  for (let i = 0; i <= TILE_W * 4; i++) {
    const x = i / 4;
    const f = (x % RR_PX) / RR_PX;
    const y = BASE - vtachV(f) * MM * GAIN;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.strokeStyle = '#2bff6b';
  g.lineWidth   = 2.4;
  g.lineJoin    = 'round';
  g.lineCap     = 'round';
  g.stroke();
}());

// ── 6. Animation ─────────────────────────────────────────────────
let t0 = null;
let paused = false;
let pauseStart = 0;
let rafId = null;
let frozenScrollPx = 0;

const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶' : '⏸';
  pauseBtn.setAttribute('aria-label', paused ? 'Play strip' : 'Pause strip');

  if (paused) {
    pauseStart = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    return;
  }

  if (pauseStart) t0 += performance.now() - pauseStart;
  rafId = requestAnimationFrame(frame);
});

function frame(ts) {
  if (paused) return;
  if (!t0) t0 = ts;

  const t        = (ts - t0) * 0.001;
  frozenScrollPx = (t * SPEED) % TILE_W;

  drawGridStatic();

  let srcX = frozenScrollPx;
  let dstX = 0;

  while (dstX < CW) {
    const sliceW = Math.min(TILE_W - srcX, CW - dstX);
    ctx.drawImage(wfTile, srcX, 0, sliceW, CH, dstX, 0, sliceW, CH);
    dstX += sliceW;
    srcX = 0;
  }

  rafId = requestAnimationFrame(frame);
}
rafId = requestAnimationFrame(frame);

// ── 7. Magnifier (active only when paused) ──────────────────────
const magCanvas = document.getElementById('mag');
const magCtx    = magCanvas.getContext('2d');

const MAG_R      = 70;   // lens radius px (CSS pixels)
const MAG_SCALE  = 5;    // zoom factor

function resizeMag() {
  magCanvas.width  = Math.round(CW * DPR);
  magCanvas.height = Math.round(CH * DPR);
  magCanvas.style.width  = CW + 'px';
  magCanvas.style.height = CH + 'px';
}
resizeMag();
window.addEventListener('resize', resizeMag);

let magX = -1, magY = -1, magVisible = false;

function drawMagnifier() {
  magCtx.clearRect(0, 0, magCanvas.width, magCanvas.height);
  if (!magVisible || !paused || magX < 0) return;

  const scale = DPR;
  const cx = magX * scale;   // centre in canvas pixels
  const cy = magY * scale;
  const r  = MAG_R * scale;

  // ── clip to circle ──
  magCtx.save();
  magCtx.beginPath();
  magCtx.arc(cx, cy, r, 0, Math.PI * 2);
  magCtx.clip();

  // ── dark green background (matches grid bg) ──
  magCtx.fillStyle = '#000b00';
  magCtx.fillRect(cx - r, cy - r, r * 2, r * 2);

  // ── draw zoomed grid inside lens ──
  const sm = 3.78 * MAG_SCALE * scale;
  const lg = sm * 5;
  const ox = cx - magX * MAG_SCALE * scale;   // origin offset
  const oy = cy - magY * MAG_SCALE * scale;

  magCtx.strokeStyle = 'rgba(0, 160, 0, 0.18)';
  magCtx.lineWidth = 1;
  for (let x = ((cx - r - ox) / sm | 0) * sm + ox; x < cx + r; x += sm) {
    magCtx.beginPath(); magCtx.moveTo(x, cy - r); magCtx.lineTo(x, cy + r); magCtx.stroke();
  }
  for (let y = ((cy - r - oy) / sm | 0) * sm + oy; y < cy + r; y += sm) {
    magCtx.beginPath(); magCtx.moveTo(cx - r, y); magCtx.lineTo(cx + r, y); magCtx.stroke();
  }
  magCtx.strokeStyle = 'rgba(0, 255, 120, 0.30)';
  for (let x = ((cx - r - ox) / lg | 0) * lg + ox; x < cx + r; x += lg) {
    magCtx.beginPath(); magCtx.moveTo(x, cy - r); magCtx.lineTo(x, cy + r); magCtx.stroke();
  }
  for (let y = ((cy - r - oy) / lg | 0) * lg + oy; y < cy + r; y += lg) {
    magCtx.beginPath(); magCtx.moveTo(cx - r, y); magCtx.lineTo(cx + r, y); magCtx.stroke();
  }

  // ── draw zoomed waveform tile ──
  // Source region: a strip of width 2*R/MAG_SCALE centred on magX in the frozen strip
  const srcW  = (r * 2) / MAG_SCALE;
  const srcH  = CH * scale;                   // full height of the tile
  // Where in the TILE does magX fall?
  const frozenSrcX = (frozenScrollPx + magX * scale) % (TILE_W * scale);
  let tilePixelX = frozenSrcX / scale;         // tile coords (un-DPR)

  // Source centre in tile space
  const halfSrcW = srcW / (2 * scale);         // half-source-width in tile px
  let srcLeft = tilePixelX - halfSrcW;
  const dstLeft = cx - r;
  const dstTop  = cy - r;
  const dstW    = r * 2;
  const dstH    = r * 2;

  // How many pixels of the magnified canvas does CH cover?
  const zoomedCH = CH * MAG_SCALE * scale;
  // Vertical offset so the strip centre in the tile maps to the lens centre
  const srcCenterY = CH * 0.58;               // BASE in tile coords
  const dstCenterY = cy;
  const scaledSrcCY = srcCenterY * MAG_SCALE * scale;
  const tileDrawY   = dstCenterY - scaledSrcCY;

  // Draw, wrapping tile if needed
  if (srcLeft < 0) srcLeft += TILE_W;
  const rightEdge = srcLeft + srcW / scale;

  if (rightEdge <= TILE_W) {
    magCtx.drawImage(
      wfTile,
      srcLeft, 0, srcW / scale, CH,
      dstLeft, tileDrawY, dstW, zoomedCH
    );
  } else {
    // wrap: draw two segments
    const part1W = TILE_W - srcLeft;
    const part1Dst = part1W * MAG_SCALE * scale;
    magCtx.drawImage(
      wfTile,
      srcLeft, 0, part1W, CH,
      dstLeft, tileDrawY, part1Dst, zoomedCH
    );
    const part2W = (srcW / scale) - part1W;
    magCtx.drawImage(
      wfTile,
      0, 0, part2W, CH,
      dstLeft + part1Dst, tileDrawY, part2W * MAG_SCALE * scale, zoomedCH
    );
  }

  magCtx.restore();

  // ── lens border ──
  magCtx.beginPath();
  magCtx.arc(cx, cy, r, 0, Math.PI * 2);
  magCtx.strokeStyle = 'rgba(43, 255, 107, 0.55)';
  magCtx.lineWidth = 2 * scale;
  magCtx.stroke();

  // ── crosshair ──
  magCtx.strokeStyle = 'rgba(43, 255, 107, 0.25)';
  magCtx.lineWidth = scale;
  magCtx.beginPath();
  magCtx.moveTo(cx - r + 6 * scale, cy);
  magCtx.lineTo(cx + r - 6 * scale, cy);
  magCtx.stroke();
  magCtx.beginPath();
  magCtx.moveTo(cx, cy - r + 6 * scale);
  magCtx.lineTo(cx, cy + r - 6 * scale);
  magCtx.stroke();
}

// Track mouse/touch — only show when paused
canvas.addEventListener('mousemove', e => {
  if (!paused) { magVisible = false; drawMagnifier(); return; }
  const rect = canvas.getBoundingClientRect();
  magX = e.clientX - rect.left;
  magY = e.clientY - rect.top;
  magVisible = true;
  drawMagnifier();
});
canvas.addEventListener('mouseleave', () => {
  magVisible = false;
  drawMagnifier();
});
canvas.addEventListener('touchmove', e => {
  if (!paused) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  magX = e.touches[0].clientX - rect.left;
  magY = e.touches[0].clientY - rect.top;
  magVisible = true;
  drawMagnifier();
}, { passive: false });
canvas.addEventListener('touchend', () => {
  magVisible = false;
  drawMagnifier();
});
// Hide magnifier when unpausing
pauseBtn.addEventListener('click', () => {
  if (!paused) { magVisible = false; drawMagnifier(); }
}, true);  // capture=true so it fires before the main handler toggles paused

</script>
</body>
</html>
