<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - ACNHS</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
    
    <script src="js/acnhs-logo-base64.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/watermark.css">
    
    <style>
        :root {
            --bg-dark: #0a2540;
            --bg-darker: #1a2942;
            --accent: #2dd4bf;
            --text-light: #94a3b8;
            --text-white: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        html {
            color-scheme: light;
        }

        body {
            background: linear-gradient(135deg, #0a2540 0%, #1a2942 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* LOGIN CARD */
        .login-card {
            background: rgba(26, 41, 66, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* LOGO SECTION */
        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.15) 0%, rgba(45, 212, 191, 0.05) 70%, transparent 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid rgba(45, 212, 191, 0.5);
            position: relative;
            box-shadow: 0 0 40px rgba(45, 212, 191, 0.5), 0 0 80px rgba(45, 212, 191, 0.3), inset 0 0 25px rgba(45, 212, 191, 0.15);
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.3) 0%, transparent 70%);
            filter: blur(20px);
            opacity: 0.7;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes logoGlow {
            0%, 100% {
                box-shadow: 0 0 40px rgba(45, 212, 191, 0.5), 0 0 80px rgba(45, 212, 191, 0.3), inset 0 0 25px rgba(45, 212, 191, 0.15);
            }
            50% {
                box-shadow: 0 0 60px rgba(45, 212, 191, 0.7), 0 0 100px rgba(45, 212, 191, 0.4), inset 0 0 35px rgba(45, 212, 191, 0.25);
            }
        }

        .logo-wrapper img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(45, 212, 191, 0.4));
        }

        .logo-section h1 {
            font-size: 28px;
            color: var(--text-white);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-section .subtitle {
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .logo-section p {
            color: var(--text-light);
            font-size: 14px;
            font-weight: 400;
        }

        /* ERROR MESSAGE */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: shake 0.5s ease;
        }

        .error-message.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-message::before {
            content: '⚠️';
            font-size: 18px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-white);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-light);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(10, 37, 64, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-white);
            font-size: 15px;
            transition: all 0.3s ease;
            font-weight: 400;
        }

        .form-group input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(10, 37, 64, 0.7);
            box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.1);
        }

        .form-group input:focus + .input-icon {
            color: var(--accent);
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #022c22;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 24px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .login-btn:hover {
            background: #26c4b5;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(45, 212, 191, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .btn-text,
        .login-btn .loading-spinner {
            position: relative;
            z-index: 1;
        }

        .loading-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(2, 44, 34, 0.3);
            border-top-color: #022c22;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        .login-btn.loading .loading-spinner {
            display: block;
        }

        /* FOOTER LINKS */
        .footer-section {
            margin-top: 28px;
            text-align: center;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
        }

        .footer-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 10px;
            background: rgba(10, 37, 64, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-link:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(45, 212, 191, 0.1);
            transform: translateX(-4px);
        }

        .footer-link::before {
            content: '←';
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .footer-link:hover::before {
            transform: translateX(-4px);
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .logo-section h1 {
                font-size: 24px;
            }

            .logo-wrapper {
                width: 80px;
                height: 80px;
            }

            .logo-wrapper img {
                width: 55px;
                height: 55px;
            }
        }

        /* REDUCE MOTION */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <div class="logo-wrapper">
                <img data-acnhs-logo alt="ACNHS Logo">
            </div>
            <h1>Teacher Login</h1>
            <p class="subtitle">Faculty Portal</p>
            <p>Armenian College of Nursing & Health Sciences</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="teacherLoginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        autocomplete="username"
                        placeholder="Enter your username"
                        spellcheck="false"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        autocomplete="current-password"
                        placeholder="Enter your password"
                    >
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <div class="loading-spinner"></div>
            </button>
        </form>

        <div class="footer-section">
            <div class="divider">
                <span>or</span>
            </div>
            <a href="login.html" class="footer-link">Admin Login</a>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        // Initialize Supabase from global config
        const db = initSupabase();
        const form = document.getElementById('teacherLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Check if already logged in
        const existingRole = sessionStorage.getItem('userRole');
        if (existingRole === 'Teacher' || existingRole === 'Admin') {
            window.location.href = 'admin-hub.html';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                loginBtn.classList.add('loading');
            } else {
                loginBtn.classList.remove('loading');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            setLoading(true);

            try {
                // Query teachers table for matching username
                const { data: teacher, error } = await db
                    .from('teachers')
                    .select('*')
                    .eq('username', username)
                    .eq('active', true)
                    .single();

                if (error || !teacher) {
                    showError('Invalid username or password');
                    setLoading(false);
                    return;
                }

                // Try to verify password using bcrypt via Edge Function
                // If function doesn't exist, fall back to plain text comparison
                let passwordValid = false;
                
                try {
                    const { data: verifyData, error: verifyError } = await db.functions.invoke('hash-password', {
                        body: {
                            action: 'verify',
                            password: password,
                            hash: teacher.password_hash
                        }
                    });

                    if (verifyError) {
                        console.warn('Hash function not available, using plain text comparison (TEMPORARY)');
                        // Fallback: check if password matches plain_password or password_hash
                        passwordValid = (teacher.plain_password && password === teacher.plain_password) || 
                                       password === teacher.password_hash;
                    } else {
                        passwordValid = verifyData?.match || false;
                        console.log('✅ Password verified with bcrypt');
                    }
                } catch (funcError) {
                    console.warn('Hash function error, using plain text comparison (TEMPORARY):', funcError);
                    // Fallback: check if password matches plain_password or password_hash
                    passwordValid = (teacher.plain_password && password === teacher.plain_password) || 
                                   password === teacher.password_hash;
                }

                if (!passwordValid) {
                    showError('Invalid username or password');
                    setLoading(false);
                    return;
                }

                // Update last_login timestamp
                await db
                    .from('teachers')
                    .update({ last_login: new Date().toISOString() })
                    .eq('id', teacher.id);

                // Get teacher's assigned groups
                const { data: assignments } = await db
                    .from('teacher_group_assignments')
                    .select('group_id, role_title')
                    .eq('teacher_id', teacher.id);

                // Store session data
                sessionStorage.setItem('userRole', 'Teacher');
                sessionStorage.setItem('teacherId', teacher.id);
                sessionStorage.setItem('teacherName', teacher.full_name);
                sessionStorage.setItem('teacherEmail', teacher.email);
                sessionStorage.setItem('teacherUsername', teacher.username);
                sessionStorage.setItem('teacherGroups', JSON.stringify(assignments || []));

                // Redirect to admin hub
                window.location.href = 'admin-hub.html';

            } catch (err) {
                console.error('Login error:', err);
                showError('An error occurred during login. Please try again.');
                setLoading(false);
            }
        });

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // Apply logo after page load
        if (typeof applyAcnshLogo === 'function') {
            applyAcnshLogo();
        }
    </script>
</body>
</html>
