<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login — ACNHS</title>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0DJ1793XW8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0DJ1793XW8', {
        'anonymize_ip': true,
        'cookie_flags': 'SameSite=None;Secure'
      });
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
    <link rel="shortcut icon" href="assets/images/favicon-32.png">

    <script src="js/acnhs-logo-base64.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/watermark.css">
    <link rel="stylesheet" href="css/cookie-consent.css">

    <style>
        :root {
            --navy-900: #04111f;
            --navy-800: #071b30;
            --navy-700: #0c2444;
            --navy-600: #112d55;
            --gold-500: #c9a84c;
            --gold-400: #d4b56a;
            --gold-300: #e2cc92;
            --gold-200: #f0e3bc;
            --gold-glow: rgba(201,168,76,0.14);
            --border-gold: rgba(201,168,76,0.28);
            --text-primary: #f0ece3;
            --text-secondary: #c8bfb2;
            --text-muted: #8a8070;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }
        *, *::before, *::after {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        html, body { height: 100%; }
        html { color-scheme: dark; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--navy-900);
            background-image:
                radial-gradient(ellipse 80% 70% at 50% -5%, rgba(201,168,76,0.08) 0%, transparent 65%),
                radial-gradient(ellipse 60% 80% at 10% 90%, rgba(12,36,68,0.9) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; min-height: 100vh;
        }
        .login-card {
            background: rgba(7,27,48,0.85);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 460px; width: 100%;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.06);
            position: relative; overflow: hidden;
            animation: slideUp 0.55s cubic-bezier(0.16,1,0.3,1);
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-500), transparent);
        }
        .login-card::after {
            content: ''; position: absolute; top: -80px; left: 50%;
            transform: translateX(-50%); width: 500px; height: 300px;
            background: radial-gradient(ellipse at top, rgba(201,168,76,0.07), transparent 70%);
            pointer-events: none;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(36px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo-section { text-align: center; margin-bottom: 36px; position: relative; z-index: 1; }
        .logo-wrapper {
            width: 128px; height: 128px; margin: 0 auto 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid var(--gold-500);
            background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, rgba(201,168,76,0.04) 60%, transparent 100%);
            box-shadow: 0 0 40px rgba(201,168,76,0.35), 0 0 80px rgba(201,168,76,0.15), inset 0 0 24px rgba(201,168,76,0.1);
            position: relative; animation: logoGlow 3s ease-in-out infinite;
        }
        .logo-wrapper::before {
            content: ''; position: absolute; inset: -16px; border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,0.2) 0%, transparent 70%);
            filter: blur(18px); opacity: 0.6;
        }
        @keyframes logoGlow {
            0%,100% { box-shadow: 0 0 40px rgba(201,168,76,0.35), 0 0 80px rgba(201,168,76,0.15), inset 0 0 24px rgba(201,168,76,0.1); }
            50%      { box-shadow: 0 0 56px rgba(201,168,76,0.5),  0 0 100px rgba(201,168,76,0.22), inset 0 0 32px rgba(201,168,76,0.16); }
        }
        .logo-wrapper img {
            width: 108px; height: 108px; object-fit: contain; position: relative; z-index: 1;
            filter: drop-shadow(0 0 12px rgba(201,168,76,0.3));
        }
        .logo-section h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 26px; font-weight: 800; color: var(--gold-200); margin-bottom: 6px;
        }
        .logo-section .subtitle {
            color: var(--gold-400); font-size: 13px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
        }
        .logo-section p { color: var(--text-muted); font-size: 13px; }
        .error-message {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
            border-left: 4px solid #ef4444; color: #fca5a5;
            padding: 14px 16px; border-radius: var(--radius-md); margin-bottom: 24px;
            font-size: 14px; font-weight: 500; display: none; animation: shake 0.5s ease;
        }
        .error-message.show { display: flex; align-items: center; gap: 10px; }
        .error-message::before { content: '\26A0\FE0F'; font-size: 16px; }
        @keyframes shake {
            0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }  75% { transform: translateX(-5px); }
        }
        .form-group { margin-bottom: 20px; position: relative; z-index: 1; }
        .form-group label {
            display: block; color: var(--gold-300); font-size: 12px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;
        }
        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 17px; color: var(--text-muted); pointer-events: none;
        }
        .form-group input {
            width: 100%; padding: 14px 16px 14px 48px;
            background: rgba(4,17,31,0.6); border: 1.5px solid var(--border-gold);
            border-radius: var(--radius-md); color: var(--text-primary);
            font-size: 14px; font-family: 'Inter', sans-serif; transition: all 0.25s;
        }
        .form-group input::placeholder { color: var(--text-muted); }
        .form-group input:focus {
            outline: none; border-color: var(--gold-500);
            background: rgba(4,17,31,0.8); box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
        }
        .login-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
            color: var(--navy-900); border: none; border-radius: var(--radius-md);
            font-size: 15px; font-weight: 800; font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px; cursor: pointer; transition: all 0.25s;
            margin-top: 24px; position: relative; overflow: hidden; z-index: 1;
        }
        .login-btn::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            border-radius: 50%; background: rgba(255,255,255,0.25);
            transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s;
        }
        .login-btn:hover::before { width: 320px; height: 320px; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(201,168,76,0.4); }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        .login-btn .btn-text, .login-btn .loading-spinner { position: relative; z-index: 1; }
        .loading-spinner {
            display: none; width: 22px; height: 22px;
            border: 3px solid rgba(4,17,31,0.25); border-top-color: var(--navy-900);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-btn.loading .btn-text     { display: none; }
        .login-btn.loading .loading-spinner { display: block; }
        .footer-section { margin-top: 28px; text-align: center; position: relative; z-index: 1; }
        .divider { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border-gold);
        }
        .divider span { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        .footer-link {
            display: inline-flex; align-items: center; gap: 8px; color: var(--gold-400);
            text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
            transition: all 0.25s; padding: 10px 22px; border-radius: var(--radius-sm);
            background: transparent; border: 1px solid var(--border-gold);
        }
        .footer-link:hover { color: var(--gold-300); border-color: var(--gold-500); background: var(--gold-glow); transform: translateX(-4px); }
        .footer-link::before { content: '\2190'; font-size: 16px; transition: transform 0.25s; }
        .footer-link:hover::before { transform: translateX(-4px); }
        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; }
            .logo-section h1 { font-size: 22px; }
            .logo-wrapper { width: 96px; height: 96px; }
            .logo-wrapper img { width: 80px; height: 80px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <div class="logo-wrapper">
                <img data-acnhs-logo alt="ACNHS Logo">
            </div>
            <h1>Teacher Login</h1>
            <p class="subtitle">Faculty Portal</p>
            <p>Armenian College of Nursing &amp; Health Sciences</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="teacherLoginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">&#128100;</span>
                    <input type="text" id="username" name="username" required
                        autocomplete="username" placeholder="Enter your username" spellcheck="false">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">&#128274;</span>
                    <input type="password" id="password" name="password" required
                        autocomplete="current-password" placeholder="Enter your password">
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <div class="loading-spinner"></div>
            </button>
        </form>

        <div class="footer-section">
            <div class="divider"><span>or</span></div>
            <a href="login.html" class="footer-link">Admin Login</a>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        // Initialize Supabase from global config
        const db = initSupabase();
        const form = document.getElementById('teacherLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Check if already logged in
        const existingRole = sessionStorage.getItem('userRole');
        if (existingRole === 'Teacher' || existingRole === 'Admin') {
            window.location.href = 'admin-hub.html';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                loginBtn.classList.add('loading');
            } else {
                loginBtn.classList.remove('loading');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            setLoading(true);

            try {
                // Query teachers table for matching username
                const { data: teacher, error } = await db
                    .from('teachers')
                    .select('*')
                    .eq('username', username)
                    .eq('active', true)
                    .single();

                if (error || !teacher) {
                    showError('Invalid username or password');
                    setLoading(false);
                    return;
                }

                // Verify password via Edge Function (PBKDF2-SHA256); fall back to direct compare
                let passwordValid = false;
                try {
                    const { data: verifyData, error: verifyError } = await db.functions.invoke('hash-password', {
                        body: {
                            action: 'verify',
                            password: password,
                            hash: teacher.password_hash
                        }
                    });
                    if (!verifyError && typeof verifyData?.match === 'boolean') {
                        passwordValid = verifyData.match;
                    } else {
                        // Fallback: Edge Function unavailable — compare directly (covers plain-text legacy passwords)
                        passwordValid = password === teacher.password_hash;
                    }
                } catch (funcError) {
                    // Fallback: network/function error
                    passwordValid = password === teacher.password_hash;
                }

                if (!passwordValid) {
                    showError('Invalid username or password');
                    setLoading(false);
                    return;
                }

                // Update last_login timestamp
                await db
                    .from('teachers')
                    .update({ last_login: new Date().toISOString() })
                    .eq('id', teacher.id);

                // Get teacher's assigned groups
                const { data: assignments } = await db
                    .from('teacher_group_assignments')
                    .select('group_id, role_title')
                    .eq('teacher_id', teacher.id);

                // Store session data
                sessionStorage.setItem('userRole', 'Teacher');
                sessionStorage.setItem('teacherId', teacher.id);
                sessionStorage.setItem('teacherName', teacher.full_name);
                sessionStorage.setItem('teacherEmail', teacher.email);
                sessionStorage.setItem('teacherUsername', teacher.username);
                sessionStorage.setItem('teacherGroups', JSON.stringify(assignments || []));
                sessionStorage.setItem('teacherSubjects', JSON.stringify(teacher.subjects || []));

                // Mirror critical auth keys to localStorage so popup windows (window.open)
                // inherit the session — sessionStorage is tab-scoped and not shared across windows
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'Teacher');
                localStorage.setItem('userName', teacher.full_name || '');
                localStorage.setItem('userEmail', teacher.email || '');
                localStorage.setItem('teacherEmail', teacher.email || '');
                localStorage.setItem('teacherName', teacher.full_name || '');
                localStorage.setItem('teacherSubjects', JSON.stringify(teacher.subjects || []));
                localStorage.setItem('teacherGroups', JSON.stringify(assignments || []));
                localStorage.setItem('isAdmin', 'false');

                // Redirect to admin hub
                window.location.href = 'admin-hub.html';

            } catch (err) {
                console.error('Login error:', err);
                showError('An error occurred during login. Please try again.');
                setLoading(false);
            }
        });

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // Apply logo after page load
        if (typeof applyAcnshLogo === 'function') {
            applyAcnshLogo();
        }
    </script>

    <!-- Analytics & Cookie Consent -->
    <script src="js/analytics-config.js"></script>
    <script src="js/cookie-consent.js"></script>
</body>
</html>
