<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — Armenian College of Nursing &amp; Health Sciences</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/Seal.png">
  <link rel="shortcut icon" href="assets/images/favicon-32.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/watermark.css">

  <style>
    :root {
      --bg-dark: #0a2540;
      --bg-darker: #020617;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-muted: #64748b;
      --accent: #2dd4bf;
      --accent-dark: #134e4a;
      --border: rgba(15, 23, 42, 0.08);
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      --nav-height: 76px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-light);
      min-height: 100vh;
      color: #0f172a;
      line-height: 1.6;
      padding-top: var(--nav-height);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      background: rgba(10, 37, 64, 0.95);
      backdrop-filter: blur(16px);
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;
      height: 100%;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .acn-logo {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      line-height: 1.15;
    }

    .acn-logo span {
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .topics-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .topics-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--bg-dark);
    }

    .add-topic-btn {
      background: var(--accent);
      color: #022c22;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(20, 184, 166, 0.35);
    }

    .add-topic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(20, 184, 166, 0.45);
    }

    .topics-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    @media (max-width: 1400px) {
      .topics-container {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 1024px) {
      .topics-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .topics-container {
        grid-template-columns: 1fr;
      }
    }

    .topic-card {
      background: linear-gradient(135deg, #ffffff, #f8fafc);
      border-radius: 16px;
      padding: 0;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .topic-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 45px rgba(15, 23, 42, 0.15);
    }

    .topic-card-header {
      background: linear-gradient(135deg, var(--bg-dark), #1e3a5f);
      color: white;
      padding: 20px 18px;
      position: relative;
      overflow: hidden;
    }

    .topic-card-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.15), transparent 70%);
      border-radius: 50%;
    }

    .topic-card-content {
      position: relative;
      z-index: 1;
    }

    .topic-title {
      font-size: 18px;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .topic-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: rgba(248, 250, 252, 0.8);
      flex-wrap: wrap;
    }

    .document-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(45, 212, 191, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid rgba(45, 212, 191, 0.3);
    }

    .topic-card-body {
      padding: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .topic-actions {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: rgba(248, 250, 252, 0.5);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(15, 23, 42, 0.15);
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      color: var(--bg-dark);
      transition: all 0.15s ease;
      flex: 1;
    }

    .icon-btn:hover {
      background: rgba(15, 23, 42, 0.08);
      border-color: rgba(15, 23, 42, 0.25);
      transform: translateY(-1px);
    }

    .icon-btn.delete {
      color: #991b1b;
    }

    .icon-btn.delete:hover {
      background: rgba(220, 38, 38, 0.1);
      border-color: #dc2626;
      color: #991b1b;
    }

    .notes-list {
      display: grid;
      gap: 16px;
      padding: 8px 0;
    }

    .note-item {
      padding: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffffff, #fefefe);
      border: 2px solid rgba(15, 23, 42, 0.06);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 0;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.02);
      position: relative;
    }

    .note-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #2dd4bf, #14b8a6);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .note-item:hover::before {
      opacity: 1;
    }

    .note-item:last-child {
      margin-bottom: 0;
    }

    .note-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(45, 212, 191, 0.08);
      border-color: rgba(45, 212, 191, 0.2);
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: linear-gradient(135deg, rgba(248, 250, 252, 0.5), rgba(255, 255, 255, 0.3));
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      gap: 16px;
    }

    .note-title {
      font-weight: 700;
      color: #0f172a;
      font-size: 15px;
      flex: 1;
      line-height: 1.4;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .note-title::before {
      content: '📄';
      font-size: 20px;
      flex-shrink: 0;
    }

    .note-text {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      padding: 16px 24px;
      min-height: 60px;
      max-height: 120px;
      overflow-y: auto;
    }

    .note-text:empty::before {
      content: 'No preview available - Click View to open document';
      color: #94a3b8;
      font-style: italic;
      font-size: 13px;
    }

    .note-actions-small {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-small {
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.1), rgba(20, 184, 166, 0.08));
      border: 1.5px solid rgba(45, 212, 191, 0.3);
      color: #0d9488;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .btn-small:hover {
      background: linear-gradient(135deg, #2dd4bf, #14b8a6);
      border-color: #14b8a6;
      color: #022c22;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
    }

    .btn-small.delete {
      background: rgba(220, 38, 38, 0.05);
      border-color: rgba(220, 38, 38, 0.2);
      color: #dc2626;
    }

    .btn-small.delete:hover {
      background: linear-gradient(135deg, #fecaca, #fca5a5);
      border-color: #dc2626;
      color: #991b1b;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
    }

    .add-note-btn {
      background: rgba(45, 212, 191, 0.1);
      border: 1px dashed rgba(45, 212, 191, 0.4);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      color: var(--accent-dark);
      transition: all 0.15s ease;
      margin-top: 12px;
    }

    .add-note-btn:hover {
      background: rgba(45, 212, 191, 0.15);
      border-color: rgba(45, 212, 191, 0.6);
    }

    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-muted);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 24px;
      color: var(--bg-dark);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn-cancel {
      background: rgba(15, 23, 42, 0.08);
      color: var(--bg-dark);
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit {
      background: var(--accent);
      color: #022c22;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    footer {
      margin: 40px auto 40px;
      max-width: 1000px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Note Cards - Professional Design */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }

    .note-card {
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(2,8,23,.07);
      overflow: hidden;
      transition: .22s ease;
      position: relative;
      cursor: pointer;
    }

    .note-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 50px rgba(2,8,23,.08);
      border-color: rgba(11,92,255,.25);
    }

    .note-card .thumb {
      height: 138px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(240px 140px at 30% 20%, rgba(11,92,255,.18), transparent 60%),
        radial-gradient(240px 160px at 90% 30%, rgba(0,180,120,.16), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.65));
      border-bottom: 1px solid rgba(15,23,42,.10);
    }

    .note-card .docicon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(15,23,42,.06);
      border: 1px solid rgba(15,23,42,.10);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: rgba(15,23,42,.55);
      letter-spacing: .6px;
      font-size: 14px;
    }

    .note-card .content {
      padding: 14px 16px 16px;
    }

    .note-card .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(11,92,255,.18);
      background: rgba(11,92,255,.08);
      color: rgba(11,92,255,.95);
      margin-bottom: 10px;
    }

    .note-card h3 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.2px;
      line-height: 1.25;
      min-height: 42px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #0f172a;
      font-weight: 700;
    }

    .note-card .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
    }

    .note-card .meta .left {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .note-card .meta .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(100,116,139,.55);
      display: inline-block;
    }

    @media (max-width: 768px) {
      .topics-header h1 { font-size: 2rem; }
      .add-topic-btn { padding: 12px 20px; font-size: 14px; }
      main { padding: 24px 20px 60px; }
      
      .notes-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
      }
    }
  </style>
</head>
<body class="acnhs-watermarked">

<header>
  <div class="nav">
    <a href="index.html" class="acn-logo" id="logoLink">
      <span>Armenian College</span>
      <span>of Nursing &amp; Health Sciences</span>
    </a>
    <a class="back-btn" id="backBtn">← Back to Home</a>
  </div>
</header>

<main>
  <div class="topics-container" id="topicsContainer"></div>
  
  <div class="empty-state" id="emptyState">
    <strong>No topics yet.</strong>
    <p style="margin-top:6px;">Click the + button to create your first topic.</p>
  </div>
</main>

<footer>
  © <span id="year"></span> Armenian College of Nursing &amp; Health Sciences · Notes workspace
</footer>

<!-- Topic Modal -->
<div class="modal" id="topicModal">
  <div class="modal-content">
    <div class="modal-header">New Topic</div>
    <div class="form-group">
      <label for="topicTitleInput">Topic Title</label>
      <input type="text" id="topicTitleInput" placeholder="Ex: Clinical Rotation Notes">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTopicModal()">Cancel</button>
      <button class="btn-submit" onclick="saveTopic()">Create Topic</button>
    </div>
  </div>
</div>

<!-- Note Modal -->
<div class="modal" id="noteModal">
  <div class="modal-content">
    <div class="modal-header">New Note</div>
    <div class="form-group">
      <label for="noteTitleInput">Note Title</label>
      <input type="text" id="noteTitleInput" placeholder="Ex: Patient Assessment">
    </div>
    <div class="form-group">
      <label for="noteContentInput">Content</label>
      <textarea id="noteContentInput" placeholder="Write your note here..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNoteModal()">Cancel</button>
      <button class="btn-submit" onclick="saveNote()">Save Note</button>
    </div>
  </div>
</div>

  function renderTopics() {
    if (topics.length === 0) {
      topicsContainer.style.display = 'none';
      emptyState.style.display = 'block';
      return;
    }

    topicsContainer.style.display = 'grid';
    emptyState.style.display = 'none';

    topicsContainer.innerHTML = topics.map(topic => `
      <div class="topic-card" onclick="openTopicPage('${topic.id}')">
        <div class="topic-card-header">
          <div class="topic-card-content">
            <div class="topic-title">${escapeHtml(topic.title)}</div>
            <div class="topic-meta">
              <span class="document-count">📄 ${topic.notes?.length || 0} document${(topic.notes?.length || 0) !== 1 ? 's' : ''}</span>
              <span style="color: rgba(255,255,255,0.7); font-size: 13px;">Created ${new Date(topic.created).toLocaleDateString()}</span>
            </div>
          </div>
        </div>
        <div class="topic-card-body">
          <div class="notes-list">
            ${topic.notes && topic.notes.length > 0 ? topic.notes.map(note => `
              <div class="note-item">
                <div class="note-item-header">
                  <div class="note-title">${escapeHtml(note.title)}</div>
                  <div class="note-actions-small">
                    <button class="btn-small" onclick="event.stopPropagation(); viewNote('${topic.id}', '${note.id}')">View</button>
                    <button class="btn-small delete" onclick="event.stopPropagation(); deleteNote('${topic.id}', '${note.id}')">Delete</button>
                  </div>
                </div>
                <div class="note-text">${escapeHtml(note.content).substring(0, 100)}${note.content.length > 100 ? '...' : ''}</div>
              </div>
            `).join('') : '<p style="color:var(--text-muted);font-size:14px;padding:12px;">No notes yet. Click "+ Note" to add one.</p>'}
          </div>
        </div>
        <div class="topic-actions">
          <button class="icon-btn" onclick="event.stopPropagation(); addNoteToTopic('${topic.id}')">+ Note</button>
          <button class="icon-btn delete" onclick="event.stopPropagation(); deleteTopic('${topic.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str = '') {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function openTopicModal() {
    document.getElementById('topicModal').classList.add('active');
    document.getElementById('topicTitleInput').value = '';
    document.getElementById('topicTitleInput').focus();
  }

  function closeTopicModal() {
    document.getElementById('topicModal').classList.remove('active');
  }

  function saveTopic() {
    const title = document.getElementById('topicTitleInput').value.trim();
    if (!title) {
      alert('Please enter a topic title.');
      return;
    }

    const newTopic = {
      id: crypto.randomUUID(),
      title,
      notes: [],
      created: Date.now()
    };

    topics.push(newTopic);
    localStorage.setItem(storageKey, JSON.stringify(topics));
    closeTopicModal();
    renderTopics();
  }

  function deleteTopic(topicId) {
    if (!confirm('Delete this topic and all its notes?')) return;
    topics = topics.filter(t => t.id !== topicId);
    localStorage.setItem(storageKey, JSON.stringify(topics));
    renderTopics();
  }

  function openNoteModal(topicId) {
    currentTopicId = topicId;
    document.getElementById('noteModal').classList.add('active');
    document.getElementById('noteTitleInput').value = '';
    document.getElementById('noteContentInput').value = '';
    document.getElementById('noteTitleInput').focus();
  }

  function closeNoteModal() {
    document.getElementById('noteModal').classList.remove('active');
    currentTopicId = null;
  }

  function saveNote() {
    const title = document.getElementById('noteTitleInput').value.trim();
    const content = document.getElementById('noteContentInput').value.trim();
    
    if (!title || !content) {
      alert('Please fill in both title and content.');
      return;
    }

    const topic = topics.find(t => t.id === currentTopicId);
    if (!topic) return;

    const newNote = {
      id: crypto.randomUUID(),
      title,
      content,
      created: Date.now()
    };

    topic.notes.push(newNote);
    localStorage.setItem(storageKey, JSON.stringify(topics));
    closeNoteModal();
    renderTopics();
  }

  function addNoteToTopic(topicId) {
    openNoteModal(topicId);
  }

  function deleteNote(topicId, noteId) {
    if (!confirm('Delete this note?')) return;
    const topic = topics.find(t => t.id === topicId);
    if (!topic) return;
    topic.notes = topic.notes.filter(n => n.id !== noteId);
    localStorage.setItem(storageKey, JSON.stringify(topics));
    renderTopics();
  }

  function openTopicPage(topicId) {
    renderTopicDocuments(topicId);
  }

  function renderTopicDocuments(topicId) {
    const topic = topics.find(t => t.id === topicId);
    if (!topic) {
      alert('Topic not found');
      return;
    }

    // Hide the main topics container and empty state
    topicsContainer.style.display = 'none';
    emptyState.style.display = 'none';

    // Create a container for the topic view if it doesn't exist
    let topicView = document.getElementById('topicView');
    if (!topicView) {
      topicView = document.createElement('div');
      topicView.id = 'topicView';
      document.querySelector('main').appendChild(topicView);
    }

    const documents = topic.notes || [];
    const escapedTitle = escapeHtml(topic.title);
    
    let docsHtml = '';
    if (documents.length > 0) {
      docsHtml = '<div class="notes-grid">' +
        documents.map(doc => {
          // Clean up title by removing common suffixes
          let cleanTitle = doc.title
            .replace(/\s*-\s*NCLEX Comprehensive Review$/i, '')
            .replace(/\s*-\s*NCLEX Review$/i, '')
            .replace(/\s*\(Fundamentals\)$/i, '')
            .trim();
          
          const escapedDocTitle = escapeHtml(cleanTitle);
          const docDate = new Date(doc.created).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          
          return `
            <div class="note-card" onclick="openDocumentWindow('${topicId}', '${doc.id}')">
              <div class="thumb">
                <img src="assets/images/ACNHS_logo_30kb.png" alt="ACNHS" style="width: 100px; height: 100px; opacity: 0.5; object-fit: contain;">
              </div>
              <div class="content">
                <div class="badge">� Fundamentals</div>
                <h3>${escapedDocTitle}</h3>
                <div class="meta">
                  <div class="left"><span class="dot"></span> Created ${docDate}</div>
                  <div>Open →</div>
                </div>
              </div>
            </div>
          `;
        }).join('') +
      '</div>';
    } else {
      docsHtml = `
        <div class="empty-state">
          <div style="font-size: 48px; opacity: 0.3;">📝</div>
          <p>No documents yet</p>
          <p style="font-size: 14px; margin-top: 8px;">Click the + button to add HTML document</p>
        </div>
      `;
    }

    topicView.innerHTML = `
      <div style="border-bottom: 2px solid rgba(15,23,42,0.1); padding-bottom: 16px; margin-bottom: 32px;">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin: 0; color: #0f172a;">${escapedTitle}</h2>
      </div>

      ${docsHtml}
      
      <button class="fab" onclick="openAddModal()" style="position: fixed; bottom: 32px; right: 32px; width: 64px; height: 64px; background: linear-gradient(135deg, #2dd4bf, #14b8a6); border: none; border-radius: 50%; color: #022c22; font-size: 32px; font-weight: 700; cursor: pointer; box-shadow: 0 12px 40px rgba(45, 212, 191, 0.4); transition: all 0.3s ease; z-index: 1000; display: flex; align-items: center; justify-content: center;">+</button>
      
      <div class="add-modal" id="addModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 37, 64, 0.85); backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 24px; padding: 40px; max-width: 500px; width: 90%; box-shadow: 0 30px 80px rgba(0,0,0,0.3);">
          <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 24px; color: #0f172a;">Add HTML Document</h2>
          <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #0f172a;">Document Title:</label>
            <input type="text" id="docTitle" placeholder="e.g., Acute Kidney Injury (AKI)" 
              style="width: 100%; padding: 12px; border: 2px solid rgba(15, 23, 42, 0.1); border-radius: 12px; font-size: 15px; font-family: 'Inter', sans-serif;">
          </div>
          <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #0f172a;">HTML Content:</label>
            <textarea id="docContent" placeholder="Paste your HTML code here..." 
              style="width: 100%; height: 300px; padding: 12px; border: 2px solid rgba(15, 23, 42, 0.1); border-radius: 12px; font-size: 14px; font-family: 'Monaco', monospace; resize: vertical;"></textarea>
          </div>
          <div style="display: flex; gap: 12px;">
            <button onclick="saveHtmlDocument('${topicId}')" style="flex: 1; padding: 14px; background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: #022c22; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px;">
              Save Document
            </button>
            <button onclick="closeAddModal()" style="flex: 1; padding: 14px; background: rgba(15, 23, 42, 0.05); border: none; border-radius: 12px; font-weight: 600; cursor: pointer; color: #64748b;">Cancel</button>
          </div>
        </div>
      </div>
    `;

    topicView.style.display = 'block';
    currentTopicId = topicId;
  }

  function backToTopics() {
    const topicView = document.getElementById('topicView');
    if (topicView) {
      topicView.style.display = 'none';
    }
    topicsContainer.style.display = 'grid';
    if (topics.length === 0) {
      emptyState.style.display = 'block';
    }
    currentTopicId = null;
  }

  function openAddModal() {
    document.getElementById('addModal').style.display = 'flex';
    document.getElementById('docTitle').value = '';
    document.getElementById('docContent').value = '';
    document.getElementById('docTitle').focus();
  }

  function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
  }

  function saveHtmlDocument(topicId) {
    const title = document.getElementById('docTitle').value.trim();
    const content = document.getElementById('docContent').value.trim();
    
    if (!title) {
      alert('Please enter a document title');
      return;
    }
    
    if (!content) {
      alert('Please enter HTML content');
      return;
    }
    
    const topic = topics.find(t => t.id === topicId);
    if (!topic) return;

    const newDoc = {
      id: Date.now().toString(),
      title: title,
      content: content,
      created: new Date().toISOString(),
      type: 'html'
    };

    if (!topic.notes) topic.notes = [];
    topic.notes.push(newDoc);
    localStorage.setItem(storageKey, JSON.stringify(topics));
    
    closeAddModal();
    renderTopicDocuments(topicId);
  }

  function openDocumentWindow(topicId, docId) {
    const topic = topics.find(t => t.id === topicId);
    if (!topic) return;
    
    const doc = topic.notes.find(n => n.id === docId);
    if (!doc) return;

    // If document has an HTML file reference, open it directly
    if (doc.htmlFile) {
      window.open(doc.htmlFile, '_blank');
    } else {
      // Open note-viewer with URL parameters for custom HTML content
      window.open(`note-viewer.html?topicId=${topicId}&docId=${docId}`, '_blank');
    }
  }

  function renderDocumentView(topicId, docId) {
    const topic = topics.find(t => t.id === topicId);
    if (!topic) {
      alert('Topic not found');
      return;
    }
    
    const doc = topic.notes.find(n => n.id === docId);
    if (!doc) {
      alert('Document not found');
      return;
    }

    const escapedDocTitle = escapeHtml(doc.title);

    // Open in a clean new window
    const docWindow = window.open('', '_blank');
    const pageHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${escapedDocTitle}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
    }
    header {
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      color: white;
      padding: 32px 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin: 0;
    }
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      background: white;
      min-height: calc(100vh - 96px);
    }
  </style>
</head>
<body>
  <header>
    <h1>${escapedDocTitle}</h1>
  </header>
  <div class="content">
    ${doc.content}
  </div>
</body>
</html>`;

    docWindow.document.write(pageHtml);
    docWindow.document.close();
    
    // Clear the session storage to go back to documents list
    sessionStorage.removeItem('viewDoc');
  }

  function viewNote(topicId, noteId) {
    const topic = topics.find(t => t.id === topicId);
    if (!topic) return;
    const note = topic.notes.find(n => n.id === noteId);
    if (!note) return;

    const pageHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${escapeHtml(note.title)} — ACNHS Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#0b1124;font-family:'Inter',sans-serif;color:#0f172a;padding:40px 20px;}
    main{max-width:900px;margin:0 auto;}
    .note-shell{background:#fff;border-radius:28px;box-shadow:0 40px 80px rgba(15,23,42,0.15);overflow:hidden;border:1px solid rgba(15,23,42,0.08);}
    header{padding:48px;background:linear-gradient(135deg,#0f172a,#1d3a68);color:#fff;}
    header h1{margin:0;font-size:2.5rem;line-height:1.2;}
    header p{margin-top:12px;color:rgba(248,250,252,0.8);} 
    section{padding:40px;background:#fff;font-size:1.02rem;line-height:1.8;color:#1e293b;white-space:pre-wrap;}
    footer{text-align:center;font-size:0.85rem;color:#64748b;margin:24px 0;}
  </style>
</head>
<body>
  <main>
    <article class="note-shell">
      <header>
        <p style="letter-spacing:0.3em;text-transform:uppercase;font-size:0.75rem;color:rgba(248,250,252,0.7);">Armenian College of Nursing &amp; Health Sciences</p>
        <h1>${escapeHtml(note.title)}</h1>
        <p>Topic: ${escapeHtml(topic.title)} • Created ${new Date(note.created).toLocaleString()}</p>
      </header>
      <section>${escapeHtml(note.content)}</section>
    </article>
    <footer>Generated ${new Date().toLocaleString()} · Internal use only</footer>
  </main>
</body>
</html>`;

    const newPage = window.open('', '_blank', 'noopener');
    newPage.document.write(pageHtml);
    newPage.document.close();
  }

  // Wait for DOM to be ready before accessing elements
  document.addEventListener('DOMContentLoaded', function() {
    const addTopicBtn = document.getElementById('addTopicBtn');
    if (addTopicBtn) {
      addTopicBtn.addEventListener('click', openTopicModal);
    }
    
    // Close modal on outside click
    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });
    });
  });

  renderTopics();
</script>
</body>
</html>
