<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Document - ACNHS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #1a365d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            color: #00d9ff;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 217, 255, 0.2);
            border-top: 4px solid #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            font-size: 1.25rem;
            margin-top: 1rem;
            color: #a0aec0;
        }

        .control-number {
            font-size: 1.5rem;
            font-weight: 600;
            color: #00d9ff;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">ACNHS</div>
        <div class="spinner"></div>
        <div class="message">Verifying your document...</div>
        <div class="control-number" id="controlNumber"></div>
    </div>

    <script>
        // Extract parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const controlNumber = urlParams.get('ctrl');
        const verificationCode = urlParams.get('code');

        console.log('Verify page - Control number:', controlNumber);
        console.log('Verify page - Verification code:', verificationCode);

        // Check if it's an application control number (ACN format)
        if (controlNumber && controlNumber.trim() !== '') {
            // Display the control number
            document.getElementById('controlNumber').textContent = controlNumber;

            // Redirect to document verification page
            setTimeout(() => {
                const redirectUrl = `../verify-document.html?ctrl=${encodeURIComponent(controlNumber)}`;
                console.log('Redirecting to Document Verification:', redirectUrl);
                window.location.href = redirectUrl;
            }, 1000);
        } 
        // Check if it's a transcript verification code (TR format)
        else if (verificationCode && verificationCode.trim() !== '') {
            // Display the verification code
            document.getElementById('controlNumber').textContent = verificationCode;
            document.querySelector('.message').textContent = 'Verifying transcript...';

            // Redirect to transcript verification page with the code
            setTimeout(() => {
                const redirectUrl = `../verify-transcript.html?code=${encodeURIComponent(verificationCode)}&autocheck=true`;
                console.log('Redirecting to Transcript Verification:', redirectUrl);
                window.location.href = redirectUrl;
            }, 1000);
        } 
        // No parameters provided, show default verification page
        else {
            document.querySelector('.message').textContent = 'No verification code provided';
            document.querySelector('.spinner').style.display = 'none';
            setTimeout(() => {
                window.location.replace("../verify-transcript.html");
            }, 2000);
        }
    </script>
</body>
</html>
