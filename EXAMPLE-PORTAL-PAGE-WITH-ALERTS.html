<!-- 
  EXAMPLE: How to Add Alert Engine to Your Portal Pages
  
  This is a template showing how to integrate the alert system
  into any student portal page.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Portal Page — Internal | Armenian College of Nursing & Health Sciences (ACNHS)</title>
  
  <!-- YOUR EXISTING STYLESHEETS -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- STEP 1: Add Supabase CDN -->
  <script src="js/supabase.min.js"></script>
  
  <!-- STEP 2: Add Supabase Config -->
  <script src="js/supabase-config.js"></script>
  
  <!-- STEP 3: Add Alert Engine -->
  <script src="js/alerts.js?v=20260228"></script>
  
  <!-- That's it! The alert engine auto-initializes on page load -->
</head>
<body>

  <!-- YOUR PORTAL CONTENT -->
  <header>
    <h1>Welcome to Student Portal</h1>
  </header>

  <main>
    <section>
      <h2>My Dashboard</h2>
      <p>Your portal content here...</p>
    </section>
  </main>

  <!-- YOUR EXISTING SCRIPTS -->
  <script>
    // Example: Set student data for alert engine to detect
    // This should already exist in your portal pages
    
    const studentData = {
      id: 'student-uuid-here',
      student_id: 'ACNHS-123456789',
      full_name: 'John Doe',
      email: 'john.doe@example.com'
    };
    
    // Store in sessionStorage (alert engine checks here first)
    sessionStorage.setItem('studentData', JSON.stringify(studentData));
    
    // OR store in localStorage as fallback
    localStorage.setItem('currentStudent', JSON.stringify(studentData));
  </script>

  <!-- 
    ✅ DONE! 
    
    The alert engine will now:
    1. Detect the logged-in student
    2. Fetch applicable alerts from Supabase
    3. Check schedule and display rules
    4. Show alerts in beautiful modals
    5. Track impressions and responses automatically
    
    NO ADDITIONAL CODE REQUIRED!
  -->

</body>
</html>
