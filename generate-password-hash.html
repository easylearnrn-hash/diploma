<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Generate SHA-256 Password Hash</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #0a2540;
      color: white;
    }
    input, button {
      padding: 12px;
      font-size: 16px;
      width: 100%;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid #14b8a6;
    }
    input {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    button {
      background: #14b8a6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0f766e;
    }
    .result {
      background: rgba(20, 184, 166, 0.1);
      border: 2px solid #14b8a6;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      word-break: break-all;
      display: none;
    }
    .sql {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      margin-top: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🔐 Generate SHA-256 Password Hash</h1>
  <p>Enter your password to generate the correct hash for invoice.html authentication</p>
  
  <input type="password" id="password" placeholder="Enter your password">
  <button onclick="generateHash()">Generate Hash</button>
  
  <div class="result" id="result">
    <h3>✅ Hash Generated!</h3>
    <p><strong>SHA-256 Hash:</strong></p>
    <div id="hashOutput" style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; font-family: monospace;"></div>
    
    <h3 style="margin-top: 30px;">📋 Run this SQL in Supabase:</h3>
    <div class="sql" id="sqlOutput"></div>
    
    <p style="margin-top: 20px; font-size: 14px; opacity: 0.7;">
      Go to: <a href="https://supabase.com/dashboard" target="_blank" style="color: #14b8a6;">Supabase Dashboard</a> → 
      Your Project → SQL Editor → Paste the SQL above
    </p>
  </div>
  
  <script>
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }
    
    async function generateHash() {
      const password = document.getElementById('password').value;
      
      if (!password) {
        alert('Please enter a password');
        return;
      }
      
      const hash = await hashPassword(password);
      
      document.getElementById('hashOutput').textContent = hash;
      
      const sql = `-- Update hrachfilm@gmail.com password hash to SHA-256
UPDATE admin_users 
SET password_hash = '${hash}',
    updated_at = NOW()
WHERE email = 'hrachfilm@gmail.com';

-- Verify the update
SELECT email, name, role, status, 
       LEFT(password_hash, 20) || '...' as password_hash_preview
FROM admin_users 
WHERE email = 'hrachfilm@gmail.com';`;
      
      document.getElementById('sqlOutput').textContent = sql;
      document.getElementById('result').style.display = 'block';
    }
    
    // Allow Enter key
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateHash();
      }
    });
  </script>
</body>
</html>
