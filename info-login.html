<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login — ACNHS Applicant Registry</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/acnhs-seal.png">
  <link rel="shortcut icon" href="assets/acnhs-seal.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/acnhs-logo-base64.js"></script>
  <script src="js/acnhs-seal-base64.js"></script>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #d4b56a;
      --gold-glow: rgba(201,168,76,0.12);
      --gold-border: rgba(201,168,76,0.28);
      --navy: #020a1a;
      --navy-card: #07111f;
      --navy-input: #0c1c30;
      --text: #f0f4ff;
      --text-muted: #8a9ec0;
      --border: rgba(255,255,255,0.08);
      --error: #ef4444;
      --error-bg: rgba(239,68,68,0.1);
      --success: #10b981;
      --success-bg: rgba(16,185,129,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(201,168,76,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 75%, rgba(15,23,42,0.95) 0%, transparent 55%),
        linear-gradient(160deg, #020a1a 0%, #091525 50%, #040d1a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Background seal watermark */
    body::before {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(201,168,76,0.025) 0%, transparent 65%);
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--navy-card);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.04),
        0 40px 80px rgba(0,0,0,0.7),
        0 8px 24px rgba(0,0,0,0.5);
      animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
      position: relative;
    }

    /* Gold hairline */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold) 35%, var(--gold-light) 50%, var(--gold) 65%, transparent);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header */
    .card-header {
      padding: 36px 40px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(201,168,76,0.04) 0%, transparent 100%);
    }

    .seal-wrap {
      width: 70px; height: 70px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--gold-glow);
      border: 1.5px solid var(--gold-border);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 6px rgba(201,168,76,0.04), 0 4px 20px rgba(0,0,0,0.4);
    }
    .seal-wrap img { width: 44px; height: 44px; object-fit: contain; }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: #f0f4ff;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }
    .card-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .card-subtitle strong {
      color: var(--gold);
      font-weight: 600;
    }

    /* Form body */
    .card-body { padding: 32px 40px 36px; }

    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 13px 16px;
      background: var(--navy-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.22s;
      -webkit-appearance: none;
    }
    .form-control::placeholder { color: var(--text-muted); opacity: 0.6; }
    .form-control:focus {
      outline: none;
      border-color: rgba(201,168,76,0.5);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
      background: rgba(10,22,42,1);
    }
    .form-control:focus + .focus-line { width: 100%; }

    .password-wrap { position: relative; }
    .toggle-pw {
      position: absolute;
      right: 14px; top: 50%; transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color .2s;
      line-height: 1;
    }
    .toggle-pw:hover { color: var(--text); }

    /* Alert */
    .alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 20px;
      border: 1px solid;
      display: none;
    }
    .alert.error  { background: var(--error-bg);   color: #fca5a5; border-color: rgba(239,68,68,0.25); display: flex; }
    .alert.success{ background: var(--success-bg); color: #6ee7b7; border-color: rgba(16,185,129,0.25); display: flex; }
    .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

    /* Submit button */
    .submit-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--gold) 0%, #a8872c 100%);
      color: #05100f;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.22s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(201,168,76,0.35);
    }
    .submit-btn:active:not(:disabled) { transform: scale(0.99); }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(5,16,15,0.3);
      border-top-color: #05100f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .card-footer {
      padding: 16px 40px 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .footer-note {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .footer-note a { color: var(--gold); text-decoration: none; transition: color .2s; }
    .footer-note a:hover { color: var(--gold-light); }

    /* Decorative lines */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  </style>
</head>
<body>

<div class="login-card">

  <!-- Header -->
  <div class="card-header">
    <div class="seal-wrap" id="sealWrap">
      <img id="sealImg" src="assets/acnhs-seal.png" alt="ACNHS Seal">
    </div>
    <div class="card-title">Staff Portal Access</div>
    <div class="card-subtitle">
      <strong>ACNHS Applicant Registry</strong><br>
      Authorized personnel only. Use your staff credentials.
    </div>
  </div>

  <!-- Form Body -->
  <div class="card-body">

    <!-- Alert -->
    <div class="alert" id="alertBox" role="alert">
      <span class="alert-icon" id="alertIcon">⚠</span>
      <span id="alertMsg"></span>
    </div>

    <form id="loginForm" novalidate autocomplete="off">

      <div class="form-group">
        <label class="form-label" for="identifier">Email or Username</label>
        <input
          class="form-control"
          type="text"
          id="identifier"
          name="identifier"
          placeholder="e.g. admissions@acnhs.am"
          autocomplete="username"
          spellcheck="false"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-wrap">
          <input
            class="form-control"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">👁</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Sign In to Registry</span>
      </button>

    </form>
  </div>

  <!-- Footer -->
  <div class="card-footer">
    <p class="footer-note">
      For students or applicants, use the
      <a href="login.html">Student Portal login</a>.<br>
      Contact your supervisor if you need access.
    </p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script>
/* ── Already logged in? ─────────────────────────── */
(function() {
  if (sessionStorage.getItem('infoAccess') === 'true' ||
      sessionStorage.getItem('isAdmin')    === 'true') {
    window.location.href = 'info.html';
  }
})();

/* ── Load seal via base64 if available ──────────── */
window.addEventListener('DOMContentLoaded', () => {
  const sealImg = document.getElementById('sealImg');
  if (window.ACNHS_SEAL_DATA_URL) {
    sealImg.src = window.ACNHS_SEAL_DATA_URL;
  } else if (window.ACNHS_SEAL_BASE64) {
    sealImg.src = `data:image/png;base64,${window.ACNHS_SEAL_BASE64}`;
  }
});

/* ── Password toggle ────────────────────────────── */
document.getElementById('togglePw').addEventListener('click', function() {
  const pw = document.getElementById('password');
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  this.textContent = show ? '🙈' : '👁';
});

/* ── Alert helper ────────────────────────────────── */
function showAlert(msg, type = 'error') {
  const box  = document.getElementById('alertBox');
  const icon = document.getElementById('alertIcon');
  const txt  = document.getElementById('alertMsg');
  box.className = `alert ${type}`;
  icon.textContent = type === 'success' ? '✓' : '⚠';
  txt.textContent = msg;
}
function hideAlert() {
  document.getElementById('alertBox').className = 'alert';
}

/* ── SHA-256 hash ─────────────────────────────── */
async function hashPassword(password) {
  const data = new TextEncoder().encode(password);
  const buf  = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

/* ── Login ───────────────────────────────────────── */
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideAlert();

  const identifier = document.getElementById('identifier').value.trim();
  const password   = document.getElementById('password').value;

  if (!identifier || !password) {
    showAlert('Please enter your email/username and password.');
    return;
  }

  const btn     = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');

  btn.disabled       = true;
  spinner.style.display = 'block';
  btnText.textContent   = 'Signing in…';

  try {
    const supabase = initSupabase();
    if (!supabase) throw new Error('Connection unavailable. Please refresh and try again.');

    const passwordHash = await hashPassword(password);

    /* Query admin_users — match by email OR username */
    const { data: users, error } = await supabase
      .from('admin_users')
      .select('id, name, email, username, password_hash, role, status, permissions')
      .or(`email.eq.${identifier},username.eq.${identifier}`)
      .eq('status', 'active')
      .limit(1);

    if (error) throw new Error('Authentication service unavailable. Please try again.');

    if (!users || users.length === 0) {
      showAlert('Account not found or inactive. Contact your supervisor.');
      return;
    }

    const user = users[0];

    if (user.password_hash !== passwordHash) {
      showAlert('Incorrect password. Please try again.');
      return;
    }

    /* ✅ Authenticated — write info-specific session */
    sessionStorage.setItem('infoAccess',      'true');
    sessionStorage.setItem('infoViewerName',  user.name  || identifier);
    sessionStorage.setItem('infoViewerEmail', user.email || identifier);
    sessionStorage.setItem('infoViewerRole',  user.role  || 'staff');
    sessionStorage.setItem('infoViewerId',    user.id);

    /* Also mark as admin if they have admin_users entry */
    sessionStorage.setItem('isAdmin',   'true');
    sessionStorage.setItem('isLoggedIn','true');
    sessionStorage.setItem('userEmail', user.email  || identifier);
    sessionStorage.setItem('userName',  user.name   || identifier);
    sessionStorage.setItem('userRole',  user.role   || 'staff');
    if (user.permissions) {
      sessionStorage.setItem('userPermissions', JSON.stringify(user.permissions));
    }

    showAlert('Access granted. Loading registry…', 'success');
    btnText.textContent = 'Redirecting…';

    setTimeout(() => { window.location.href = 'info.html'; }, 800);

  } catch (err) {
    console.error('Login error:', err);
    showAlert(err.message || 'Sign-in failed. Please try again.');
  } finally {
    if (document.getElementById('alertBox').className.includes('error')) {
      btn.disabled          = false;
      spinner.style.display = 'none';
      btnText.textContent   = 'Sign In to Registry';
    }
  }
});

/* Focus first field */
document.getElementById('identifier').focus();
</script>
</body>
</html>
