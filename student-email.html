<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Email | Armenian College of Nursing & Health Sciences (ACNHS)</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #020617;
      --navy-900: #0c1427;
      --navy-800: #111e38;
      --navy-700: #162040;
      --navy-600: #1d2b4f;
      --gold-600: #b8860b;
      --gold-500: #c9a84c;
      --gold-400: #d4b06a;
      --gold-300: #dfc088;
      --gold-200: #ead8a8;
      --gold-100: #f5f0e0;
      --text-primary:   #ede8df;
      --text-secondary: #bdb3a5;
      --text-muted:     #7a7060;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm:  8px;
    }

    /* ─── RESET & BASE ─── */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      background: linear-gradient(165deg, var(--navy-900) 0%, var(--navy-950) 100%);
      height: 100vh;
      overflow: hidden;
      color: var(--text-primary);
    }

    .email-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── HEADER ─── */
    .header {
      padding: 11px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 14, 28, 0.98);
      border-bottom: 1px solid rgba(201, 168, 76, 0.18);
      flex-shrink: 0;
      gap: 12px;
    }

    .header-seal {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(201, 168, 76, 0.35);
      background: rgba(201, 168, 76, 0.06);
      flex-shrink: 0;
    }

    .header-sub {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--gold-200);
      letter-spacing: -0.01em;
      margin: 0;
    }

    .student-email-badge {
      background: rgba(201, 168, 76, 0.08);
      color: var(--gold-400);
      border: 1px solid rgba(201, 168, 76, 0.22);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.01em;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .refresh-btn {
      width: 32px;
      height: 32px;
      background: rgba(201, 168, 76, 0.07);
      border: 1px solid rgba(201, 168, 76, 0.20);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--gold-400);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .refresh-btn:hover { background: rgba(201,168,76,.13); color: var(--gold-300); }
    .refresh-btn.refreshing { pointer-events: none; }
    .refresh-btn.refreshing svg { animation: spin .8s linear infinite; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ─── LAYOUT ─── */
    .email-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: 210px;
      background: rgba(7, 13, 27, 0.98);
      border-right: 1px solid rgba(201, 168, 76, 0.12);
      padding: 14px 10px;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .compose-btn {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-950);
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 11.5px;
      cursor: pointer;
      margin-bottom: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(201, 168, 76, 0.28);
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }

    .compose-btn:hover {
      opacity: .92;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(201, 168, 76, 0.42);
    }

    .nav-item {
      width: 100%;
      padding: 9px 10px;
      background: transparent;
      border: 2px solid transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background .15s, color .15s;
      letter-spacing: .02em;
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 4px;
      text-align: left;
    }

    .nav-item:hover { background: rgba(201,168,76,.06); color: var(--text-secondary); }
    .nav-item.active {
      background: rgba(201, 168, 76, 0.10);
      color: var(--gold-300);
      font-weight: 700;
      border-left-color: var(--gold-500);
    }
    .nav-item svg { flex-shrink: 0; opacity: .7; }
    .nav-item.active svg { opacity: 1; }

    /* ─── MAIN CONTENT ─── */
    .main-content {
      flex: 1;
      background: rgba(11, 19, 38, 0.88);
      overflow-y: auto;
      padding: 18px 20px;
      min-width: 0;
    }

    /* ─── BULK ACTIONS ─── */
    .bulk-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 13px;
      margin-bottom: 14px;
      border-radius: var(--radius-md);
      background: rgba(17, 27, 54, 0.65);
      border: 1px solid rgba(201, 168, 76, 0.13);
    }

    .bulk-actions-left { display: flex; align-items: center; gap: 10px; }

    .bulk-select {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: .02em;
    }

    .bulk-select input, .email-select { accent-color: var(--gold-500); cursor: pointer; }
    .bulk-count { font-size: 12px; color: var(--text-muted); }
    .bulk-actions-right { display: flex; gap: 8px; }

    .bulk-btn {
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      letter-spacing: .01em;
    }

    .bulk-btn:hover:not(:disabled) { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: var(--text-primary); }
    .bulk-btn:disabled { opacity: .38; cursor: not-allowed; }
    .bulk-btn.bulk-danger { border-color: rgba(239,68,68,.30); color: #fca5a5; }
    .bulk-btn.bulk-danger:hover:not(:disabled) { background: rgba(220,38,38,.18); border-color: rgba(239,68,68,.50); color: #fecaca; }

    /* ─── EMAIL LIST ─── */
    .email-list { display: flex; flex-direction: column; }
    .email-select { cursor: pointer; }

    .email-item {
      background: rgba(14, 22, 46, 0.70);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .15s;
      margin-bottom: 7px;
    }

    .email-item:hover { border-color: rgba(201,168,76,.25); box-shadow: 0 4px 18px rgba(0,0,0,.35); transform: translateY(-1px); }
    .email-item.unread { border-left: 3px solid var(--gold-500); background: rgba(201,168,76,.07); }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,.25); }
      50%       { box-shadow: 0 0 0 4px rgba(201,168,76,.07); }
    }

    .email-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; gap: 10px; }
    .email-header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .email-from { font-weight: 700; color: var(--text-primary); font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .email-time { font-size: 11px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .delete-btn:hover { background: rgba(220,38,38,.18); color: #fca5a5; }

    .email-subject { color: var(--text-secondary); margin-bottom: 3px; font-size: 12px; font-weight: 600; }
    .email-preview { font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ─── COMPOSE MODAL ─── */
    .compose-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .compose-modal.show { display: flex; }

    .modal-content {
      background: linear-gradient(175deg, var(--navy-800) 0%, var(--navy-900) 100%);
      border: 1px solid rgba(201, 168, 76, 0.26);
      border-top: 2px solid rgba(201, 168, 76, 0.58);
      border-radius: var(--radius-xl);
      width: 90%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.72);
      color: var(--text-primary);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.12);
    }

    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-200);
      letter-spacing: -0.01em;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: background .15s, color .15s;
      line-height: 1;
    }
    .close-btn:hover { background: rgba(220,38,38,.18); color: #fca5a5; border-color: rgba(220,38,38,.30); }

    .form-group { margin-bottom: 16px; }

    .form-group label, .form-label {
      display: block;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 13px;
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(201, 168, 76, 0.18);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 13.5px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: rgba(201, 168, 76, 0.45);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.08);
    }

    .form-group textarea { min-height: 175px; resize: vertical; line-height: 1.6; }
    .from-field { opacity: .55; cursor: not-allowed; }

    .signature-preview {
      background: #f8fafc;
      border: 1px solid rgba(201, 168, 76, 0.30);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 9px;
    }

    .button-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

    .btn { padding: 10px 22px; border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity .15s, transform .15s, box-shadow .2s; letter-spacing: .02em; }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-950);
      box-shadow: 0 4px 14px rgba(201, 168, 76, 0.32);
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,168,76,.48); }

    .btn-secondary { background: rgba(255,255,255,.05); color: var(--text-secondary); border: 1px solid rgba(255,255,255,.12); }
    .btn-secondary:hover { background: rgba(255,255,255,.09); color: var(--text-primary); border-color: rgba(255,255,255,.20); }

    /* ─── EMPTY STATE & LOADING ─── */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; }
    .empty-icon { font-size: 34px; margin-bottom: 12px; opacity: .28; color: var(--text-muted); }
    .loading { text-align: center; padding: 48px; color: var(--text-muted); font-size: 13px; letter-spacing: .02em; }

    /* ─── TOAST ─── */
    .notification {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 11px 22px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 13px;
      z-index: 2000;
      display: none;
      min-width: 260px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      letter-spacing: .01em;
    }
    .notification.show { display: block; animation: slideUp .3s cubic-bezier(.4,0,.2,1); }
    .notification.success { background: rgba(34,197,94,.13); border: 1px solid rgba(34,197,94,.38); color: #86efac; }
    .notification.error   { background: rgba(239,68,68,.13); border: 1px solid rgba(239,68,68,.38); color: #fca5a5; }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(60px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
    }

    /* ─── EMAIL DETAIL ─── */
    .email-detail { display: none; }
    .email-detail.show { display: block; }

    /* When detail is open, allow natural page-level scroll */
    body.detail-open                    { overflow-y: auto !important; height: auto !important; }
    body.detail-open .email-container   { height: auto !important; overflow: visible !important; }
    body.detail-open .email-layout      { overflow: visible !important; }
    body.detail-open .main-content      { overflow: visible !important; }

    .detail-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.10);
    }

    .detail-header {
      padding: 20px 22px;
      background: #f8fafc;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border: 1px solid rgba(226, 232, 240, 0.7);
      border-bottom: none;
    }

    .detail-subject {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: #64748b;
      font-size: 12.5px;
      font-weight: 500;
      padding-top: 11px;
      border-top: 1px solid rgba(226, 232, 240, 0.6);
    }
    .detail-meta span { display: flex; align-items: center; gap: 5px; }
    .detail-meta strong { color: #475569; font-weight: 600; }

    .detail-body {
      color: #334155;
      line-height: 1.8;
      padding: 22px;
      background: #ffffff;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      border: 1px solid rgba(226, 232, 240, 0.7);
      border-top: none;
      font-size: 14px;
      min-height: 180px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 15px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background .15s, color .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { background: rgba(255,255,255,.10); color: var(--text-primary); }

    .btn-delete {
      background: rgba(220, 38, 38, 0.10);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.28);
      padding: 7px 15px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background .15s, border-color .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-delete:hover { background: rgba(220,38,38,.22); border-color: rgba(220,38,38,.48); color: #fecaca; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      body { overflow: auto; height: auto; }
      .email-container { height: auto; }
      .email-layout { flex-direction: column; height: auto; overflow: visible; }

      .sidebar {
        width: 100%;
        flex-direction: row;
        padding: 8px 10px;
        overflow-x: auto;
        border-right: none;
        border-bottom: 1px solid rgba(201, 168, 76, 0.12);
        gap: 6px;
        flex-wrap: nowrap;
      }

      .compose-btn { margin-bottom: 0; white-space: nowrap; width: auto; padding: 7px 13px; font-size: 11px; flex-shrink: 0; }
      .nav-item    { margin-bottom: 0; white-space: nowrap; width: auto; padding: 7px 11px; font-size: 12px; flex-shrink: 0; }
      .main-content { padding: 12px; overflow: visible; }
      .bulk-btn { padding: 6px 10px; font-size: 11px; }

      #emailDetailView.show {
        position: fixed;
        inset: 0;
        z-index: 500;
        overflow-y: auto;
        background: linear-gradient(165deg, var(--navy-900) 0%, var(--navy-950) 100%);
        padding: 14px;
        display: block;
      }

      .detail-subject { font-size: 17px; }
      .detail-meta { flex-direction: column; gap: 7px; font-size: 12.5px; }
      .detail-body { font-size: 13.5px; padding: 16px; }
      .modal-content { padding: 18px; width: 95%; }
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img id="headerSeal" alt="ACNHS" class="header-seal" src="">
        <div>
          <div class="header-sub">Armenian College of Nursing &amp; Health Sciences</div>
          <h1>Student Mail</h1>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="refresh-btn" id="refreshBtn" onclick="refreshEmails()" title="Refresh emails" aria-label="Refresh emails">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        <div class="student-email-badge" id="studentEmailDisplay">Loading&hellip;</div>
      </div>
    </div>

    <div class="email-layout">
      <div class="sidebar">
        <button class="compose-btn" onclick="openCompose()">+ Compose</button>
        <button type="button" class="nav-item active" data-folder="inbox" onclick="switchFolder('inbox')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M2 8h4.5l2 2.5h3l2-2.5H18"/></svg>
          Inbox
        </button>
        <button type="button" class="nav-item" data-folder="sent" onclick="switchFolder('sent')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 3.5L9 12M17.5 3.5l-5 13-2.5-5.5L4.5 8l13-4.5z"/></svg>
          Sent
        </button>
        <button type="button" class="nav-item" data-folder="classlink" onclick="switchFolder('classlink')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11a4 4 0 0 0 5.66 0l2-2a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M12 9a4 4 0 0 0-5.66 0l-2 2a4 4 0 0 0 5.66 5.66l1-1"/></svg>
          Class Link
        </button>
      </div>

      <div class="main-content">
        <div class="bulk-actions" id="bulkActions">
          <div class="bulk-actions-left">
            <label class="bulk-select">
              <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)">
              <span>Select all</span>
            </label>
            <span class="bulk-count" id="bulkCount">0 selected</span>
          </div>
          <div class="bulk-actions-right">
            <button class="bulk-btn" id="bulkReplyBtn" onclick="replySelected()" disabled>Reply</button>
            <button class="bulk-btn" id="bulkForwardBtn" onclick="forwardSelected()" disabled>Forward</button>
            <button class="bulk-btn bulk-danger" id="bulkDeleteBtn" onclick="openBulkDeleteModal()" disabled>Delete</button>
          </div>
        </div>
        <div id="emailListView">
          <div class="loading">Loading emails...</div>
        </div>

        <div id="emailDetailView" class="email-detail">
          <div class="detail-actions">
            <button class="back-btn" id="backToListBtn" onclick="showEmailList()">← Back to Inbox</button>
            <button class="btn-delete" onclick="deleteCurrentEmail()">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M7 6V4h6v2M8 9v6M12 9v6M5 6l1 10h8l1-10"/></svg>
              Delete
            </button>
          </div>
          <div class="detail-header">
            <div class="detail-subject" id="detailSubject"></div>
            <div class="detail-meta">
              <span><strong>From:</strong> <span id="detailFrom"></span></span>
              <span><strong>To:</strong> <span id="detailTo"></span></span>
              <span><strong>Date:</strong> <span id="detailDate"></span></span>
            </div>
          </div>
          <div class="detail-body" id="detailBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Compose Modal -->
  <div class="compose-modal" id="composeModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>New Message</h2>
        <button class="close-btn" onclick="closeCompose()">×</button>
      </div>
      <form id="composeForm" onsubmit="sendEmail(event)">
        <div class="form-group">
          <label for="fromEmail">From</label>
          <input type="email" id="fromEmail" class="from-field" readonly>
        </div>
        <div class="form-group">
          <label for="toEmail">To</label>
          <input type="email" id="toEmail" required placeholder="recipient@example.com">
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" required placeholder="Enter subject">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" required placeholder="Type your message here..."></textarea>
        </div>
        <div class="form-group">
          <div class="form-label">Signature (auto-added)</div>
          <div id="signaturePreview" class="signature-preview" aria-label="Email signature preview">
            Loading signature...
          </div>
        </div>
        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="closeCompose()">Cancel</button>
          <button type="submit" class="btn btn-primary">Send</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="compose-modal" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2>Delete Email</h2>
        <button class="close-btn" onclick="closeDeleteModal()">×</button>
      </div>
      <div style="padding: 1.5rem; color: var(--text-muted);">
        <p style="margin: 0 0 1.5rem 0; font-size: 15px;">Are you sure you want to delete this email?</p>
        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="confirmDelete()" style="background: #ef4444;">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification -->
  <div class="notification" id="notification"></div>

  <script src="js/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/acnhs-seal-base64.js"></script>
  <script>
    let db;
    let currentStudent = null;
    let currentFolder = 'inbox';
  let allEmails = [];
  const emailPreviewCache = new Map();
  const selectedEmailIds = new Set();
  let lastRenderedEmails = [];
    
    // Load read emails from localStorage (persists across page refreshes)
    let readEmails = new Set(JSON.parse(localStorage.getItem('readEmails') || '[]'));
    
  const EDGE_FUNCTION_URL = `${SUPABASE_CONFIG.url}/functions/v1/send-email`;
  const RECEIVE_EMAIL_URL = `${SUPABASE_CONFIG.url}/functions/v1/receive-email`;

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      db = initSupabase();
      if (!db) {
        showNotification('Failed to initialize', 'error');
        return;
      }

      // Apply ACNHS seal to header
      const sealEl = document.getElementById('headerSeal');
      if (sealEl && typeof ACNHS_SEAL_BASE64 !== 'undefined') {
        sealEl.src = 'data:image/png;base64,' + ACNHS_SEAL_BASE64;
      }

      await loadStudentProfile();
      await loadEmails();

      // Subscribe to realtime inserts on email_history — no polling needed
      db.channel('student-email-inbox')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'email_history' },
          () => loadEmails())
        .subscribe();
    });

    async function loadStudentProfile() {
      const studentId = sessionStorage.getItem('userId') || localStorage.getItem('userId') || 
                        sessionStorage.getItem('viewerActiveStudentId') || localStorage.getItem('viewerActiveStudentId');
      
      if (!studentId) {
        showNotification('Not logged in', 'error');
        setTimeout(() => window.location.href = 'login.html', 2000);
        return;
      }

      try {
        const { data, error } = await db
          .from('students')
          .select('student_id, full_name, program, email, metadata')
          .eq('student_id', studentId)
          .single();

        if (error) throw error;

        // Get institutional email from email column or metadata
        const institutionalEmail = data.email || 
                                   data.metadata?.portal?.institutional_email || 
                                   data.metadata?.institutional_email;

        if (!institutionalEmail) {
          showNotification('No institutional email found', 'error');
          return;
        }

        const studentName = data.full_name || data.metadata?.full_name || data.metadata?.portal?.full_name || 'Student';
        const studentProgram = data.program || data.metadata?.program || data.metadata?.portal?.program || 'Nursing (RN)';

        currentStudent = {
          student_id: data.student_id,
          institutional_email: institutionalEmail,
          full_name: studentName,
          program: studentProgram
        };

        document.getElementById('studentEmailDisplay').textContent = institutionalEmail;
        document.getElementById('fromEmail').value = institutionalEmail;
        renderSignaturePreview();
      } catch (error) {
        console.error('Error loading profile:', error);
        showNotification('Error loading profile', 'error');
      }
    }

    async function loadEmails() {
      // SECURITY: Ensure student is authenticated
      if (!currentStudent || !currentStudent.institutional_email) {
        console.error('Security: No authenticated student');
        return;
      }

      console.log('📧 Loading emails for:', currentStudent.institutional_email);

      try {
        const { data, error } = await db
          .from('email_history')
          .select('id, sender, recipient, subject, status, sent_at, resend_id, error')
          .or(`sender.eq.${currentStudent.institutional_email},recipient.eq.${currentStudent.institutional_email}`)
          .order('sent_at', { ascending: false })
          .limit(50);

        if (error) throw error;

        // SECURITY: Double-check all emails belong to this student
        const secureEmails = (data || []).filter(email => 
          email.sender === currentStudent.institutional_email || 
          email.recipient === currentStudent.institutional_email
        );

  allEmails = secureEmails;
  selectedEmailIds.clear();
  updateBulkActions();
        renderEmailList();
      } catch (error) {
        console.error('❌ Error loading emails:', error);
        const message = error?.message || 'Error loading emails';
        showNotification(message, 'error');
        document.getElementById('emailListView').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <p>${escapeHtml(message)}</p>
          </div>
        `;
      }
    }

    function isClassLinkEmail(email) {
      return /class[\s-]*link/i.test(email.subject || '');
    }

    function renderEmailList() {
      const container = document.getElementById('emailListView');

      // Update back button label to reflect current folder
      const backBtn = document.getElementById('backToListBtn');
      if (backBtn) {
        const labels = { inbox: 'Inbox', sent: 'Sent', classlink: 'Class Link' };
        backBtn.textContent = '\u2190 Back to ' + (labels[currentFolder] || 'Inbox');
      }
      
      // SECURITY: Filter emails strictly by folder and student's institutional email
      let filtered = allEmails.filter(email => {
        // Verify email belongs to this student
        const belongsToStudent = email.sender === currentStudent.institutional_email || 
                                 email.recipient === currentStudent.institutional_email;
        
        if (!belongsToStudent) return false;

        if (currentFolder === 'inbox') {
          // Inbox: recipient emails that are NOT class link
          return email.recipient === currentStudent.institutional_email && !isClassLinkEmail(email);
        } else if (currentFolder === 'sent') {
          // Show emails WHERE student is the sender
          return email.sender === currentStudent.institutional_email;
        } else if (currentFolder === 'classlink') {
          // Class Link folder: only class link emails received by the student
          return email.recipient === currentStudent.institutional_email && isClassLinkEmail(email);
        }
        return false;
      });

      lastRenderedEmails = filtered;

      if (filtered.length === 0) {
        const folderLabels = { inbox: 'Inbox', sent: 'Sent', classlink: 'Class Link' };
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>No emails in ${folderLabels[currentFolder] || currentFolder}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="email-list">
          ${filtered.map(email => {
            const isSelected = selectedEmailIds.has(email.id);
            // Mark inbox emails as unread ONLY if they haven't been opened yet
            const isInboxEmail = currentFolder === 'inbox' && email.recipient === currentStudent.institutional_email;
            const hasBeenRead = readEmails.has(email.id);
            const isUnread = isInboxEmail && !hasBeenRead;
            
            return `
            <div class="email-item ${isUnread ? 'unread' : ''}" data-id="${email.id}">
              <div class="email-header">
                <div class="email-header-left" onclick="showEmailDetail('${email.id}')">
                  <input type="checkbox" class="email-select" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleEmailSelection('${email.id}', this.checked)">
                  <div class="email-from">${escapeHtml(currentFolder === 'inbox' ? email.sender : email.recipient)}</div>
                  <div class="email-time">${formatDate(email.sent_at)}</div>
                </div>
                <button class="delete-btn" onclick="event.stopPropagation(); deleteEmail('${email.id}')" title="Delete email" aria-label="Delete email">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="13" height="13" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M7 6V4h6v2M8 9v6M12 9v6M5 6l1 10h8l1-10"/></svg>
                </button>
              </div>
              <div onclick="showEmailDetail('${email.id}')">
                <div class="email-subject">${escapeHtml(email.subject || '(No Subject)')}</div>
                <div class="email-preview">${escapeHtml(emailPreviewCache.get(email.id) || 'Open to view message')}</div>
              </div>
            </div>
          `}).join('')}
        </div>
      `;

      syncSelectAllCheckbox();
    }

    function toggleEmailSelection(emailId, isSelected) {
      if (isSelected) {
        selectedEmailIds.add(emailId);
      } else {
        selectedEmailIds.delete(emailId);
      }
      updateBulkActions();
      syncSelectAllCheckbox();
    }

    function toggleSelectAll(isChecked) {
      if (isChecked) {
        lastRenderedEmails.forEach(email => selectedEmailIds.add(email.id));
      } else {
        lastRenderedEmails.forEach(email => selectedEmailIds.delete(email.id));
      }
      updateBulkActions();
      renderEmailList();
    }

    function syncSelectAllCheckbox() {
      const selectAll = document.getElementById('selectAllCheckbox');
      if (!selectAll) return;
      const renderedIds = lastRenderedEmails.map(email => email.id);
      const allSelected = renderedIds.length > 0 && renderedIds.every(id => selectedEmailIds.has(id));
      selectAll.checked = allSelected;
    }

    function updateBulkActions() {
      const count = selectedEmailIds.size;
      const bulkCount = document.getElementById('bulkCount');
      const replyBtn = document.getElementById('bulkReplyBtn');
      const forwardBtn = document.getElementById('bulkForwardBtn');
      const deleteBtn = document.getElementById('bulkDeleteBtn');
      if (bulkCount) bulkCount.textContent = `${count} selected`;
      const singleSelected = count === 1;
      if (replyBtn) replyBtn.disabled = !singleSelected;
      if (forwardBtn) forwardBtn.disabled = !singleSelected;
      if (deleteBtn) deleteBtn.disabled = count === 0;
    }

    async function refreshEmails() {
      const refreshBtn = document.getElementById('refreshBtn');
      if (!refreshBtn) return;

      // Add refreshing state
      refreshBtn.classList.add('refreshing');
      refreshBtn.disabled = true;

      try {
        await loadEmails();
        showNotification('✅ Emails refreshed successfully', 'success');
      } catch (error) {
        console.error('❌ Failed to refresh emails:', error);
        showNotification('❌ Failed to refresh emails', 'error');
      } finally {
        // Remove refreshing state
        refreshBtn.classList.remove('refreshing');
        refreshBtn.disabled = false;
      }
    }

    async function fetchEmailBodyIfMissing(email) {
      if (!email?.resend_id) return;
      const currentBody = (email.body || '').trim();
      if (currentBody && currentBody !== '(No body text available)') return;

      try {
        const response = await fetch(RECEIVE_EMAIL_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'fetch-body',
            data: { record_id: email.id, email_id: email.resend_id }
          })
        });

        const result = await response.json();
        if (!response.ok || !result?.success) {
          const errorMessage = result?.error || 'Body fetch failed';
          const isNotFound = response.status === 404 || /Inbound email not found/i.test(errorMessage);
          if (!isNotFound) {
            console.error('❌ Failed to fetch email body:', result);
            showNotification(`Body fetch failed: ${errorMessage}`, 'error');
          }
          email.body = email.body || '(Body unavailable)';
          document.getElementById('detailBody').innerHTML = escapeHtml(email.body);
          emailPreviewCache.set(email.id, stripHtml(email.body).substring(0, 120));
          return;
        }

        const hadBody = !!email.body;
        email.body = result.body || email.body;
        email.html_body = result.html_body || email.html_body;
        const _sealB64a = typeof ACNHS_SEAL_BASE64 !== 'undefined' ? ACNHS_SEAL_BASE64 : '';
        document.getElementById('detailBody').innerHTML = (email.html_body || escapeHtml(email.body || '')).replace(/\{\{ACNHS_SEAL_BASE64\}\}/g, _sealB64a);
        if (email.body && !hadBody) {
          emailPreviewCache.set(email.id, stripHtml(email.body).substring(0, 120));
          renderEmailList(); // only re-render if we gained a new preview
        }
      } catch (error) {
        console.error('❌ Error fetching email body:', error);
      }
    }

    async function showEmailDetail(emailId) {
      const email = allEmails.find(e => e.id === emailId);
      if (!email) return;

      // SECURITY: Verify email belongs to this student before displaying
      const belongsToStudent = email.sender === currentStudent.institutional_email || 
                               email.recipient === currentStudent.institutional_email;
      
      if (!belongsToStudent) {
        showNotification('❌ Security violation: Unauthorized email access attempt', 'error');
        console.error('Security violation: Attempted to access email', { 
          emailId, 
          studentEmail: currentStudent.institutional_email,
          emailSender: email.sender,
          emailRecipient: email.recipient
        });
        return;
      }

      // Mark email as read (removes glow)
      readEmails.add(emailId);
      
      // Persist to localStorage so it survives page refresh
      localStorage.setItem('readEmails', JSON.stringify([...readEmails]));
      
      // Remove unread class directly via data attribute (no loop needed)
      document.querySelector(`.email-item[data-id="${emailId}"]`)?.classList.remove('unread');

      // Store current email ID for delete functionality
      currentEmailId = emailId;

      document.getElementById('detailSubject').textContent = email.subject || '(No Subject)';
      document.getElementById('detailFrom').textContent = email.sender;
      document.getElementById('detailTo').textContent = email.recipient;
      document.getElementById('detailDate').textContent = formatDate(email.sent_at);

      // Show the detail view immediately so the user sees the header
      document.getElementById('emailListView').style.display = 'none';
      document.getElementById('emailDetailView').classList.add('show');
      document.body.classList.add('detail-open');
      window.scrollTo(0, 0);

      // Lazy-load body only the first time this email is opened (body excluded from list query)
      if (!email._bodyLoaded) {
        document.getElementById('detailBody').innerHTML = '<div class="loading">Loading message…</div>';
        try {
          const { data: bodyData } = await db
            .from('email_history')
            .select('body, html_body')
            .eq('id', emailId)
            .single();
          if (bodyData) {
            email.body      = bodyData.body;
            email.html_body = bodyData.html_body;
            if (bodyData.body && !emailPreviewCache.has(email.id)) {
              emailPreviewCache.set(email.id, stripHtml(bodyData.body).substring(0, 120));
            }
          }
        } catch (e) {
          console.error('Error fetching email body:', e);
        }
        email._bodyLoaded = true;
      }

      const _sealB64b = typeof ACNHS_SEAL_BASE64 !== 'undefined' ? ACNHS_SEAL_BASE64 : '';
      document.getElementById('detailBody').innerHTML = (email.html_body || escapeHtml(email.body || '(No content)')).replace(/\{\{ACNHS_SEAL_BASE64\}\}/g, _sealB64b);
      fetchEmailBodyIfMissing(email);
    }

    function showEmailList() {
      document.getElementById('emailListView').style.display = 'block';
      document.getElementById('emailDetailView').classList.remove('show');
      document.body.classList.remove('detail-open');
      window.scrollTo(0, 0);
    }

    function switchFolder(folder) {
      currentFolder = folder;
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.folder === folder) {
          item.classList.add('active');
        }
      });
      showEmailList();
      renderEmailList();
    }

  let currentEmailId = null;
  let emailToDelete = null;
  let bulkDeleteMode = false;
  let bulkDeleteIds = [];

    function openDeleteModal(emailId) {
      console.log('🔍 openDeleteModal called with emailId:', emailId);
      emailToDelete = emailId;
      console.log('📝 emailToDelete set to:', emailToDelete);
      bulkDeleteMode = false;
      document.getElementById('deleteModal').classList.add('show');
    }

    function openBulkDeleteModal() {
      if (selectedEmailIds.size === 0) {
        showNotification('No emails selected', 'error');
        return;
      }
      bulkDeleteMode = true;
      bulkDeleteIds = Array.from(selectedEmailIds);
      document.getElementById('deleteModal').classList.add('show');
    }

    function closeDeleteModal() {
      console.log('❌ closeDeleteModal called');
      emailToDelete = null;
      bulkDeleteMode = false;
      bulkDeleteIds = [];
      document.getElementById('deleteModal').classList.remove('show');
    }

    async function confirmDelete() {
      console.log('✅ confirmDelete called, emailToDelete:', emailToDelete);
      if (bulkDeleteMode) {
        const idsToDelete = [...bulkDeleteIds];
        closeDeleteModal();
        await performBulkDelete(idsToDelete);
        return;
      }

      if (!emailToDelete) {
        console.error('❌ No emailToDelete set!');
        return;
      }

      // Store the ID before closing modal (which resets emailToDelete to null)
      const emailIdToDelete = emailToDelete;
      console.log('📋 Stored emailIdToDelete:', emailIdToDelete);
      
      closeDeleteModal();
      await performDelete(emailIdToDelete);
    }

    async function performBulkDelete(ids) {
      try {
        if (!ids || ids.length === 0) return;
        const { error } = await db
          .from('email_history')
          .delete()
          .in('id', ids);

        if (error) throw error;

        const deletedSet = new Set(ids);
        allEmails = allEmails.filter(e => !deletedSet.has(e.id));
        selectedEmailIds.clear();
        updateBulkActions();
        showNotification('Selected emails deleted', 'success');
        renderEmailList();
      } catch (error) {
        console.error('❌ Bulk delete error:', error);
        showNotification('Failed to delete selected emails', 'error');
      }
    }

    async function performDelete(emailId) {
      console.log('🗑️ Attempting to delete email:', emailId);

      try {
        // SECURITY: Verify email belongs to this student before deleting
        const email = allEmails.find(e => e.id === emailId);
        if (!email) {
          console.error('❌ Email not found in allEmails array');
          showNotification('Email not found', 'error');
          return;
        }

        console.log('✅ Email found:', email);

        const belongsToStudent = email.sender === currentStudent.institutional_email || 
                                 email.recipient === currentStudent.institutional_email;
        
        if (!belongsToStudent) {
          showNotification('❌ Security violation: Cannot delete this email', 'error');
          console.error('Security violation: Attempted to delete unauthorized email', { 
            emailId, 
            studentEmail: currentStudent.institutional_email 
          });
          return;
        }

        console.log('🔐 Security check passed, deleting from database...');

        const { error } = await db
          .from('email_history')
          .delete()
          .eq('id', emailId);

        if (error) {
          console.error('❌ Database delete error:', error);
          throw error;
        }

        console.log('✅ Email deleted from database successfully');
        showNotification('Email deleted successfully', 'success');

        // Update local state — no DB round-trip needed
        allEmails = allEmails.filter(e => e.id !== emailId);

        // If we were viewing this email, go back to list
        if (currentEmailId === emailId) {
          showEmailList();
        }

        renderEmailList();
      } catch (error) {
        console.error('❌ Error deleting email:', error);
        showNotification('Failed to delete email: ' + (error.message || 'Unknown error'), 'error');
      }
    }

    async function deleteCurrentEmail() {
      if (!currentEmailId) {
        showNotification('No email selected', 'error');
        return;
      }

      openDeleteModal(currentEmailId);
    }

    function deleteEmail(emailId) {
      openDeleteModal(emailId);
    }

    async function getSingleSelectedEmail() {
      if (selectedEmailIds.size !== 1) {
        showNotification('Please select exactly one email', 'error');
        return null;
      }
      const emailId = Array.from(selectedEmailIds)[0];
      const email = allEmails.find(e => e.id === emailId);
      if (!email) return null;
      await fetchEmailBodyIfMissing(email);
      return email;
    }

    async function replySelected() {
      const email = await getSingleSelectedEmail();
      if (!email) return;
      openCompose();
      document.getElementById('toEmail').value = email.sender;
      const subjectPrefix = email.subject?.startsWith('Re:') ? '' : 'Re: ';
      document.getElementById('subject').value = `${subjectPrefix}${email.subject || ''}`.trim();
      const originalText = stripHtml(email.body || email.html_body || '');
      document.getElementById('message').value = `\n\n--- Original Message ---\nFrom: ${email.sender}\nDate: ${formatDate(email.sent_at)}\nSubject: ${email.subject || ''}\n\n${originalText}`;
    }

    async function forwardSelected() {
      const email = await getSingleSelectedEmail();
      if (!email) return;
      openCompose();
      document.getElementById('toEmail').value = '';
      const subjectPrefix = email.subject?.startsWith('Fwd:') ? '' : 'Fwd: ';
      document.getElementById('subject').value = `${subjectPrefix}${email.subject || ''}`.trim();
      const originalText = stripHtml(email.body || email.html_body || '');
      document.getElementById('message').value = `\n\n--- Forwarded Message ---\nFrom: ${email.sender}\nTo: ${email.recipient}\nDate: ${formatDate(email.sent_at)}\nSubject: ${email.subject || ''}\n\n${originalText}`;
    }

    function openCompose() {
      document.getElementById('composeModal').classList.add('show');
      document.getElementById('composeForm').reset();
      document.getElementById('fromEmail').value = currentStudent.institutional_email;
      renderSignaturePreview();
    }

    function closeCompose() {
      document.getElementById('composeModal').classList.remove('show');
    }

    function getSignatureLogoMarkup() {
      // Using optimized 128x128 base64-encoded seal (53KB) loaded from external file
      // This ensures the logo displays reliably in all email clients
      return `
        <img src="data:image/png;base64,${ACNHS_SEAL_BASE64}" alt="ACNHS seal" width="64" height="64" style="display:block;border-radius:50%;object-fit:cover;background:#0f172a;" />
      `;
    }

    function buildSignatureHtml() {
      const studentName = escapeHtml(currentStudent?.full_name || 'Student');
      const studentProgram = escapeHtml(currentStudent?.program || 'Nursing (RN)');
      const studentId = escapeHtml(currentStudent?.student_id || 'N/A');

      return `
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;border-top:1px solid #e2e8f0;padding-top:16px;width:100%;">
          <tr>
            <td style="width:72px;vertical-align:middle;padding-right:12px;">
              ${getSignatureLogoMarkup()}
            </td>
            <td style="font-family:Arial, sans-serif;color:#0f172a;vertical-align:middle;">
              <div style="font-size:14px;color:#334155;">Sincerely,</div>
              <div style="margin-top:6px;font-size:16px;font-weight:700;color:#0f172a;">${studentName}</div>
              <div style="margin-top:6px;font-size:13px;color:#475569;">Proud Student of ACNHS (Armenian College of Nursing &amp; Health Sciences)</div>
              <div style="margin-top:4px;font-size:13px;color:#475569;">${studentProgram}</div>
              <div style="margin-top:4px;font-size:13px;color:#475569;">Student ID: ${studentId}</div>
            </td>

      `;
    }

      return `

    function renderSignaturePreview() {
      const signaturePreview = document.getElementById('signaturePreview');
      if (!signaturePreview) return;

    }

    async function sendEmail(event) {
      event.preventDefault();

  const to = document.getElementById('toEmail').value.trim();
  const subject = document.getElementById('subject').value.trim();
  const message = document.getElementById('message').value.trim();
  const fromEmail = document.getElementById('fromEmail').value.trim();

      if (!to || !subject || !message) {
        showNotification('Please fill all fields', 'error');
        return;
      }

      // SECURITY: Enforce that FROM field must be student's institutional email
      if (fromEmail !== currentStudent.institutional_email) {
        showNotification('❌ Security violation: You can only send from your institutional email', 'error');
        console.error('Security violation attempt:', { 
          attempted: fromEmail, 
          allowed: currentStudent.institutional_email 
        });
        // Reset the FROM field to correct value
        document.getElementById('fromEmail').value = currentStudent.institutional_email;
        return;
      }

      // SECURITY: Additional check - ensure currentStudent exists
      if (!currentStudent || !currentStudent.institutional_email) {
        showNotification('❌ Authentication error. Please refresh the page.', 'error');
        return;
      }

      // Show immediate feedback and close modal
      showNotification('📤 Sending email...', 'success');
      closeCompose();

      // Send email asynchronously in background
      try {
        const formattedMessage = escapeHtml(message).replace(/\n/g, '<br>');
        const signatureHtml = buildSignatureHtml();
        const htmlBody = `
          <div style="font-family: Arial, sans-serif; color: #0f172a; line-height: 1.6;">
            ${formattedMessage}
            ${signatureHtml}
          </div>
        `;

        const textSignature = `\n\nSincerely,\n${currentStudent.full_name || 'Student'}\nProud Student of ACNHS (Armenian College of Nursing & Health Sciences)\nProgram: ${currentStudent.program || 'Nursing (RN)'}\nStudent Identification Number: ${currentStudent.student_id || 'N/A'}`;
        const textBody = `${message}${textSignature}`;

        const response = await fetch(EDGE_FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_CONFIG.anonKey}`
          },
          body: JSON.stringify({
            from: currentStudent.institutional_email, // Force use currentStudent.institutional_email
            fromName: currentStudent.full_name || 'ACNHS Student',
            to: to,
            subject: subject,
            html: htmlBody,
            text: textBody
          })
        });

        if (!response.ok) throw new Error('Failed to send email');

        // Update notification to confirm success
        showNotification('✅ Email sent successfully!', 'success');
        // Realtime subscription handles the new email appearing in Sent
      } catch (error) {
        console.error('Error sending email:', error);
        showNotification('❌ Failed to send email. Please try again.', 'error');
      }
    }

    function showNotification(message, type) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = `notification ${type} show`;
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      // Remove style/script blocks so their text doesn't bleed into previews
      div.querySelectorAll('style, script').forEach(el => el.remove());
      return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 1) return 'Just now';
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;
      
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
  </script>
</body>
