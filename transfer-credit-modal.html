<!-- Transfer Credit Modal - Add this before closing </body> tag in admin-student-page.html -->
<div id="transferCreditModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 20000; padding: 20px; overflow-y: auto;">
  <div style="max-width: 900px; margin: 40px auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 32px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
      <h2 style="font-size: 24px; font-weight: 800; color: var(--text);" id="transferModalTitle">Add Transfer Credit</h2>
      <button onclick="closeTransferCreditModal()" style="background: none; border: none; font-size: 28px; color: var(--text-muted); cursor: pointer; padding: 4px 12px; border-radius: 8px; transition: all 0.2s;">&times;</button>
    </div>

    <form id="transferCreditForm" onsubmit="saveTransferCredit(event)" style="display: grid; gap: 24px;">
      <!-- Institution Information -->
      <div style="background: rgba(45,212,191,0.05); border: 1px solid rgba(45,212,191,0.15); border-radius: 12px; padding: 20px;">
        <h3 style="font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 16px;">🏫 Institution Information</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="transfer-form-group">
            <label>Institution Name <span style="color: var(--danger);">*</span></label>
            <input type="text" id="institutionName" required placeholder="e.g., University of California">
          </div>
          <div class="transfer-form-group">
            <label>Country</label>
            <input type="text" id="institutionCountry" placeholder="e.g., USA, Armenia">
          </div>
        </div>
        <div class="transfer-form-group" style="margin-top: 16px;">
          <label>City/Location</label>
          <input type="text" id="institutionCity" placeholder="e.g., Los Angeles, Yerevan">
        </div>
      </div>

      <!-- Course Information -->
      <div style="background: rgba(59,130,246,0.05); border: 1px solid rgba(59,130,246,0.15); border-radius: 12px; padding: 20px;">
        <h3 style="font-size: 16px; font-weight: 700; color: #3b82f6; margin-bottom: 16px;">📚 Course Information</h3>
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 16px;">
          <div class="transfer-form-group">
            <label>Course Code <span style="color: var(--danger);">*</span></label>
            <input type="text" id="courseCode" required placeholder="e.g., BIO101" style="text-transform: uppercase;">
          </div>
          <div class="transfer-form-group">
            <label>Course Name <span style="color: var(--danger);">*</span></label>
            <input type="text" id="courseName" required placeholder="e.g., Introduction to Biology">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 16px;">
          <div class="transfer-form-group">
            <label>Credits/Units <span style="color: var(--danger);">*</span></label>
            <input type="number" id="credits" required min="0.5" max="12" step="0.5" placeholder="e.g., 3.0">
          </div>
          <div class="transfer-form-group">
            <label>Term Completed</label>
            <input type="text" id="termCompleted" placeholder="e.g., Fall 2023">
          </div>
          <div class="transfer-form-group">
            <label>Year</label>
            <input type="number" id="yearCompleted" min="1900" max="2100" placeholder="2023">
          </div>
        </div>
      </div>

      <!-- Grade Information -->
      <div style="background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.15); border-radius: 12px; padding: 20px;">
        <h3 style="font-size: 16px; font-weight: 700; color: #10b981; margin-bottom: 16px;">🎯 Grade Information</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
          <div class="transfer-form-group">
            <label>Grade <span style="color: var(--danger);">*</span></label>
            <input type="text" id="grade" required placeholder="e.g., 92, A, Pass">
          </div>
          <div class="transfer-form-group">
            <label>Letter Grade</label>
            <select id="letterGrade">
              <option value="">Select...</option>
              <option value="A">A (4.0)</option>
              <option value="A-">A- (3.7)</option>
              <option value="B+">B+ (3.3)</option>
              <option value="B">B (3.0)</option>
              <option value="B-">B- (2.7)</option>
              <option value="C+">C+ (2.3)</option>
              <option value="C">C (2.0)</option>
              <option value="C-">C- (1.7)</option>
              <option value="D+">D+ (1.3)</option>
              <option value="D">D (1.0)</option>
              <option value="F">F (0.0)</option>
              <option value="P">P (Pass)</option>
            </select>
          </div>
          <div class="transfer-form-group">
            <label>Grade Points (4.0 scale)</label>
            <input type="number" id="gradePoints" min="0" max="4" step="0.01" placeholder="e.g., 4.0">
          </div>
        </div>
        <div class="transfer-form-group" style="margin-top: 16px;">
          <label>ACNHS Equivalent Course</label>
          <input type="text" id="acnhsEquivalent" placeholder="Which ACNHS course does this satisfy?">
        </div>
      </div>

      <!-- Additional Information -->
      <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 20px;">
        <h3 style="font-size: 16px; font-weight: 700; color: var(--text-muted); margin-bottom: 16px;">📝 Additional Information</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="transfer-form-group">
            <label>Status</label>
            <select id="transferStatus">
              <option value="approved">✓ Approved</option>
              <option value="pending">⏳ Pending Evaluation</option>
              <option value="rejected">✗ Rejected</option>
            </select>
          </div>
          <div class="transfer-form-group">
            <label>Transfer Date</label>
            <input type="date" id="transferDate">
          </div>
        </div>
        <div class="transfer-form-group" style="margin-top: 16px;">
          <label>Evaluation Notes</label>
          <textarea id="evaluationNotes" placeholder="Add any notes about the credit evaluation..." style="min-height: 80px; resize: vertical; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; color: var(--text);"></textarea>
        </div>
      </div>

      <!-- Form Actions -->
      <div style="display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border);">
        <button type="button" onclick="closeTransferCreditModal()" style="padding: 12px 24px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-weight: 600; cursor: pointer; transition: all 0.2s;">
          Cancel
        </button>
        <button type="submit" style="padding: 12px 24px; background: var(--primary); border: none; border-radius: 12px; color: #022c22; font-weight: 700; cursor: pointer; transition: all 0.3s;">
          <span id="transferSubmitText">💾 Save Transfer Credit</span>
        </button>
      </div>
    </form>
  </div>
</div>
