<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Narine Record</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Checking Narine's Record</h1>
  <div id="output"></div>

  <script>
    const supabase = window.supabase.createClient(
      'https://zlvnxvrzotamhpezqedr.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsdm54dnJ6b3RhbWhwZXpxZWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzUyMTE3NjksImV4cCI6MjA1MDc4Nzc2OX0.w_JulQw0KHZ_s3fAuGCpYCnq8j5HoJCTxXyJIHmBDQs'
    );

    (async () => {
      // Search for Narine in students table
      const { data: students, error: studentsError } = await supabase
        .from('students')
        .select('*')
        .or('full_name.ilike.%narine%,email.ilike.%narine%,student_id.ilike.%7022395%')
        .limit(5);

      // Search for Narine in applications table
      const { data: applications, error: appsError } = await supabase
        .from('applications')
        .select('*')
        .or('applicant_name.ilike.%narine%,email.ilike.%narine%,control_number.ilike.%7022395%')
        .limit(5);

      const output = document.getElementById('output');
      
      if (studentsError) {
        output.innerHTML += `<h2>Students Error:</h2><pre>${JSON.stringify(studentsError, null, 2)}</pre>`;
      } else {
        output.innerHTML += `<h2>Students Records:</h2><pre>${JSON.stringify(students, null, 2)}</pre>`;
      }

      if (appsError) {
        output.innerHTML += `<h2>Applications Error:</h2><pre>${JSON.stringify(appsError, null, 2)}</pre>`;
      } else {
        output.innerHTML += `<h2>Applications Records:</h2><pre>${JSON.stringify(applications, null, 2)}</pre>`;
      }
    })();
  </script>
</body>
</html>
