  <style>
    :root {
      --bg:#000; --panel-bg:rgba(4,8,24,0.97); --panel-border:rgba(40,80,180,0.3);
      --gold:#c9a84c; --gold-dim:rgba(201,168,76,.13); --gold-glow:rgba(201,168,76,.4);
      --text:#e8edf6; --text-subtle:#9bacc4; --text-muted:#4a6090;
      --badge-bg:rgba(20,35,80,0.7);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:52px; background:rgba(0,0,10,0.98); border-bottom:1px solid var(--panel-border); flex-shrink:0; z-index:10; position:relative; }
    .topbar-left { display:flex; align-items:center; gap:14px; }
    .topbar-logo { font-weight:800; font-size:17px; letter-spacing:.05em; color:var(--gold); }
    .topbar-title { font-size:14px; color:var(--text-subtle); font-weight:400; }
    .topbar-back { font-size:12px; color:var(--text-muted); text-decoration:none; padding:6px 12px; border:1px solid var(--panel-border); border-radius:8px; transition:color .2s,border-color .2s; }
    .topbar-back:hover { color:var(--gold); border-color:var(--gold-glow); }
    .shell { display:grid; grid-template-columns:minmax(0,1fr) 370px; height:calc(100vh - 52px); overflow:hidden; }
    .diagram-panel { position:relative; display:flex; flex-direction:column; align-items:center; background:#000; overflow:hidden; }
    .sex-toggle { display:flex; gap:0; margin-top:14px; border-radius:10px; overflow:hidden; border:1px solid var(--panel-border); flex-shrink:0; z-index:5; }
    .sex-toggle button { padding:6px 22px; font-size:12px; font-weight:600; letter-spacing:.04em; background:transparent; color:var(--text-muted); border:none; cursor:pointer; transition:background .2s,color .2s; }
    .sex-toggle button.active { background:var(--gold); color:#060a15; }
    .svg-wrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6px 0 4px; min-height:0; }
    #anatomySvg { height:100%; max-height:calc(100vh - 100px); width:auto; max-width:100%; display:block; }
    .organ { cursor:pointer; transition:opacity .18s; }
    .organ:hover { opacity:.8; filter:brightness(1.3) drop-shadow(0 0 6px rgba(255,255,255,.5)); }
    .organ.selected { opacity:1; filter:brightness(1.5) drop-shadow(0 0 12px rgba(255,220,100,.9)); }
    .organ-label-group { cursor:pointer; opacity:.75; transition:opacity .15s; }
    .organ-label-group:hover, .organ-label-group.selected-label { opacity:1; }
    .organ-label-text { font-family:'Segoe UI',system-ui,sans-serif; font-size:9.5px; fill:#90b8e0; font-weight:500; }
    .organ-dot { transition:r .15s; }
    .organ-label-group.selected-label .organ-dot { r:3.5; fill:var(--gold); }
    .organ-label-group.selected-label .organ-label-text { fill:#c9a84c; }
    .sex-hidden { display:none; }
    .side-panel { display:flex; flex-direction:column; background:var(--panel-bg); border-left:1px solid var(--panel-border); overflow:hidden; }
    .side-inner { flex:1; overflow-y:auto; padding:16px 18px 12px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; scrollbar-color:var(--panel-border) transparent; }
    .side-header .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); margin-right:7px; vertical-align:middle; }
    .side-header h2 { font-size:15px; font-weight:700; letter-spacing:-.01em; margin-bottom:4px; }
    .side-header p { font-size:12px; color:var(--text-muted); line-height:1.5; }
    .organs-search { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.04); border:1px solid var(--panel-border); border-radius:9px; padding:6px 12px; }
    .organs-search input { background:transparent; border:none; outline:none; font-size:13px; color:var(--text); flex:1; }
    .organs-search input::placeholder { color:var(--text-muted); }
    .organs-list { display:flex; flex-direction:column; gap:2px; max-height:200px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--panel-border) transparent; }
    .organ-row { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; border-radius:8px; cursor:pointer; transition:background .15s; gap:8px; }
    .organ-row:hover { background:rgba(255,255,255,.05); }
    .organ-row.active { background:var(--gold-dim); }
    .organ-row .label { font-size:13px; font-weight:500; }
    .organ-row .badge { font-size:10px; color:var(--text-muted); padding:2px 7px; border-radius:999px; border:1px solid var(--panel-border); background:var(--badge-bg); white-space:nowrap; max-width:130px; overflow:hidden; text-overflow:ellipsis; }
    .organ-detail-card { border:1px solid var(--panel-border); border-radius:14px; background:rgba(2,6,23,.6); padding:14px 15px 16px; min-height:130px; }
    .detail-placeholder { font-size:13px; color:var(--text-muted); line-height:1.6; }
    .detail-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
    .detail-header h3 { font-size:16px; font-weight:700; letter-spacing:-.02em; }
    .detail-system { font-size:11px; color:var(--text-muted); padding:3px 8px; border-radius:999px; border:1px solid var(--panel-border); white-space:nowrap; flex-shrink:0; }
    .detail-summary { font-size:13px; color:var(--text-subtle); line-height:1.6; margin-bottom:10px; }
    .detail-more-toggle { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--gold); cursor:pointer; user-select:none; }
    .detail-more-toggle:hover { opacity:.8; }
    .detail-more-body { display:none; margin-top:8px; font-size:13px; color:var(--text-subtle); line-height:1.65; border-top:1px solid var(--panel-border); padding-top:8px; }
    .detail-more-body.open { display:block; }
    .side-footer { padding:12px 18px 14px; font-size:11px; color:var(--text-muted); border-top:1px solid var(--panel-border); line-height:1.5; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">ACNHS</span>
      <span class="topbar-title">Interactive Human Anatomy</span>
    </div>
    <a class="topbar-back" href="hub.html">← Back to Hub</a>
  </div>
  <div class="shell">

        <defs>

          <!-- REPRO -->

            <stop offset="100%" stop-color="#600838"/>

          <!-- DIAPHRAGM -->

        <g class="organ-label-group" data-label="SmallIntestine"><line x1="244" y1="534" x2="310" y2="534" stroke="#2a4a72" stroke-width="0.8"/><circle cx="310" cy="534" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="315" y="531" class="organ-label-text">Small</text><text x="315" y="541" class="organ-label-text">Intestine</text></g>
        <g class="organ-label-group" data-label="UrinaryBladder"><line x1="238" y1="592" x2="310" y2="592" stroke="#2a4a72" stroke-width="0.8"/><circle cx="310" cy="592" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="315" y="589" class="organ-label-text">Urinary</text><text x="315" y="599" class="organ-label-text">Bladder</text></g>

        <!-- LEFT side labels -->
        <g class="organ-label-group" data-label="Heart"><line x1="176" y1="220" x2="110" y2="220" stroke="#2a4a72" stroke-width="0.8"/><circle cx="110" cy="220" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="30" y="224" class="organ-label-text">Heart</text></g>
        <g class="organ-label-group" data-label="Spleen"><line x1="138" y1="408" x2="110" y2="408" stroke="#2a4a72" stroke-width="0.8"/><circle cx="110" cy="408" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="28" y="412" class="organ-label-text">Spleen</text></g>
        <g class="organ-label-group" data-label="Stomach"><line x1="165" y1="408" x2="110" y2="418" stroke="#2a4a72" stroke-width="0.8"/><circle cx="110" cy="418" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="22" y="422" class="organ-label-text">Stomach</text></g>
        <g class="organ-label-group" data-label="Pancreas"><line x1="177" y1="452" x2="110" y2="452" stroke="#2a4a72" stroke-width="0.8"/><circle cx="110" cy="452" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="22" y="456" class="organ-label-text">Pancreas</text></g>
        <g class="organ-label-group" data-label="LargeIntestine"><line x1="140" y1="522" x2="110" y2="522" stroke="#2a4a72" stroke-width="0.8"/><circle cx="110" cy="522" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="12" y="519" class="organ-label-text">Large</text><text x="12" y="529" class="organ-label-text">Intestine</text></g>
        <g class="organ-label-group sex-male" data-label="ReproductiveMale"><line x1="183" y1="636" x2="110" y2="636" stroke="#2a4a72" stroke-width="0.8"/><circle cx="110" cy="636" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="18" y="633" class="organ-label-text">Male</text><text x="18" y="643" class="organ-label-text">Repro.</text></g>
        <g class="organ-label-group sex-female sex-hidden" data-label="ReproductiveFemale"><line x1="184" y1="612" x2="110" y2="612" stroke="#2a4a72" stroke-width="0.8"/><circle cx="110" cy="612" r="2.5" fill="#c9a84c" class="organ-dot"/><text x="14" y="609" class="organ-label-text">Female</text><text x="14" y="619" class="organ-label-text">Repro.</text></g>
        <!-- Esophagus hidden -->
        <g class="organ-label-group" data-label="Esophagus"><line x1="0" y1="0" x2="0" y2="0" stroke="transparent"/></g>
       </svg>
      </div>
    </div>

    <!-- SIDE PANEL -->
    <div class="side-panel">
      <div class="side-inner">
        <div class="side-header">
          <h2><span class="dot"></span> Human Anatomy</h2>
          <p>Click any organ in the diagram or select from the list below.</p>
        </div>
        <div class="organs-search">
          <span style="font-size:13px;opacity:.6">🔍</span>
          <input id="organSearch" type="text" placeholder="Search organ…" autocomplete="off"/>
        </div>
        <div class="organs-list" id="organsList"></div>
        <div class="organ-detail-card" id="organDetail">
          <div class="detail-placeholder">Select an organ on the diagram or from the list to see educational details.</div>
        </div>
      </div>
      <div class="side-footer">Educational visualization only — not a substitute for professional medical training.</div>
    </div>
  </div>

  <script>
  const ORGANS = [
    { id:'Brain', label:'Brain', system:'Nervous System',
      summary:'Central control center for all body functions, sensation, movement, and cognition.',
      more:'The brain is divided into the cerebrum (higher cognitive functions), cerebellum (coordination and balance), and brainstem (vital autonomic functions like breathing and heart rate). It weighs ~1.4 kg and consumes ~20% of the body\'s oxygen supply at rest.' },
    { id:'Heart', label:'Heart', system:'Cardiovascular',
      summary:'Muscular four-chambered pump that circulates blood through pulmonary and systemic circuits.',
      more:'Contracts ~100,000 times per day. The right side pumps deoxygenated blood to the lungs; the left side pumps oxygenated blood to the body. Cardiac output at rest ~5 L/min. Governed by the sinoatrial (SA) node pacemaker.' },
    { id:'Lungs', label:'Lungs', system:'Respiratory',
      summary:'Paired organs enabling gas exchange — oxygen in, carbon dioxide out.',
      more:'Each lung contains ~300 million alveoli, providing ~70 m² of surface area. The right lung has 3 lobes; the left has 2. Ventilation is driven by diaphragm and intercostal muscles. Normal respiratory rate: 12–20 breaths/min.' },
    { id:'Liver', label:'Liver', system:'Digestive',
      summary:'Largest internal organ. Metabolizes nutrients, detoxifies blood, and produces bile.',
      more:'Performs 500+ functions: glycogen storage, protein synthesis (albumin, clotting factors), drug metabolism, bile production (~600–1,000 mL/day). Unique regenerative capacity. Receives dual supply from portal vein and hepatic artery.' },
    { id:'Stomach', label:'Stomach', system:'Digestive',
      summary:'J-shaped muscular sac that mechanically churns and chemically digests food.',
      more:'Secretes HCl (pH ~2) and pepsinogen for protein digestion. Three muscular layers enable powerful mixing. Gastric emptying takes 2–6 hours. The pyloric sphincter controls release of chyme into the duodenum.' },
    { id:'Pancreas', label:'Pancreas', system:'Digestive / Endocrine',
      summary:'Produces digestive enzymes (exocrine) and hormones insulin and glucagon (endocrine).',
      more:'Acinar cells secrete amylase, lipase, and proteases into the duodenum. Islets of Langerhans contain alpha cells (glucagon) and beta cells (insulin). Essential for blood glucose homeostasis.' },
    { id:'SmallIntestine', label:'Small Intestine', system:'Digestive',
      summary:'Primary site of nutrient digestion and absorption (~6 m long).',
      more:'Divided into duodenum (receives bile and pancreatic enzymes), jejunum (major absorption), and ileum (absorbs B12 and bile salts). Villi and microvilli increase surface area ~600-fold.' },
    { id:'LargeIntestine', label:'Large Intestine', system:'Digestive',
      summary:'Absorbs water and electrolytes; compacts waste into feces (~1.5 m long).',
      more:'Consists of cecum, ascending/transverse/descending/sigmoid colon, rectum, and anal canal. Houses ~100 trillion microbiota that ferment undigested carbohydrates and synthesize vitamin K.' },
    { id:'Kidneys', label:'Kidneys', system:'Urinary',
      summary:'Paired bean-shaped organs that filter blood, regulate fluid balance, and produce urine.',
      more:'Each kidney has ~1 million nephrons. Filter ~180 L of blood/day, producing ~1.5 L of urine. Regulate blood pressure (renin–angiotensin), erythropoiesis (EPO), and calcium metabolism (activate vitamin D).' },
    { id:'UrinaryBladder', label:'Urinary Bladder', system:'Urinary',
      summary:'Muscular hollow organ that stores urine (400–600 mL) prior to micturition.',
      more:'The detrusor muscle allows distension. Internal (involuntary) and external (voluntary) urethral sphincters control voiding. The micturition reflex is coordinated by the pontine micturition center.' },
    { id:'Spleen', label:'Spleen', system:'Lymphatic / Immune',
      summary:'Filters blood, destroys old red blood cells, and mounts immune responses.',
      more:'White pulp houses lymphocytes for immunity; red pulp filters blood and stores ~200 mL. Produces opsonizing antibodies, removes encapsulated bacteria, and recycles iron from hemoglobin.' },
    { id:'Gallbladder', label:'Gallbladder', system:'Digestive',
      summary:'Stores and concentrates bile (up to 10×) between meals.',
      more:'Cholecystokinin (CCK) from the duodenum triggers contraction after fat-containing meals, releasing bile into the common bile duct for fat emulsification in the small intestine.' },
    { id:'Thyroid', label:'Thyroid Gland', system:'Endocrine',
      summary:'Butterfly-shaped gland in the anterior neck that regulates metabolism and growth.',
      more:'Secretes T3 and T4 (regulate basal metabolic rate, thermogenesis, heart rate, protein synthesis) under TSH stimulation. Also produces calcitonin from C cells, lowering blood calcium.' },
    { id:'Esophagus', label:'Esophagus', system:'Digestive',
      summary:'Muscular tube (~25 cm) transporting food from pharynx to stomach via peristalsis.',
      more:'Upper portion = striated muscle (voluntary); lower = smooth muscle (involuntary). The lower esophageal sphincter (LES) prevents acid reflux. Lined with stratified squamous epithelium.' },
    { id:'Trachea', label:'Trachea', system:'Respiratory',
      summary:'Cartilaginous windpipe (~12 cm) conducting air between larynx and bronchi.',
      more:'Supported by 16–20 C-shaped hyaline cartilage rings. Lined with pseudostratified ciliated epithelium (mucociliary escalator) that traps and clears particles upward. Bifurcates at the carina (T4/T5).' },
    { id:'Diaphragm', label:'Diaphragm', system:'Respiratory',
      summary:'Dome-shaped primary muscle of inspiration separating thoracic and abdominal cavities.',
      more:'Contraction flattens the dome, increasing thoracic volume and drawing air in. Innervated by the phrenic nerve (C3–C5). Has hiatuses for the IVC, esophagus, and aorta.' },
    { id:'ReproductiveMale', label:'Male Reproductive', system:'Reproductive',
      summary:'Organs responsible for sperm production, maturation, and delivery.',
      more:'Includes testes (spermatogenesis + testosterone), epididymis (sperm maturation), vas deferens, seminal vesicles (60% of semen volume), prostate gland, and penis.' },
    { id:'ReproductiveFemale', label:'Female Reproductive', system:'Reproductive',
      summary:'Organs responsible for ovulation, fertilization, and gestation.',
      more:'Includes ovaries (oocytes + estrogen/progesterone), uterine tubes (site of fertilization), uterus (implantation and fetal development), cervix, and vagina.' },
  ];
  const ORGAN_MAP = Object.fromEntries(ORGANS.map(o=>[o.id,o]));
  let currentSex='male', selectedOrganId=null;
  const organsListEl=document.getElementById('organsList');
  const organDetailEl=document.getElementById('organDetail');
  const organSearchEl=document.getElementById('organSearch');
  const sexToggleEl=document.getElementById('sexToggle');
  const svg=document.getElementById('anatomySvg');

  function setSex(sex){
    currentSex=sex;
    sexToggleEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.sex===sex));
    svg.querySelectorAll('.sex-male').forEach(el=>el.classList.toggle('sex-hidden',sex!=='male'));
    svg.querySelectorAll('.sex-female').forEach(el=>el.classList.toggle('sex-hidden',sex!=='female'));
    if(selectedOrganId==='ReproductiveMale'&&sex!=='male') selectOrgan(null);
    if(selectedOrganId==='ReproductiveFemale'&&sex!=='female') selectOrgan(null);
    renderOrganList(organSearchEl.value);
  }
  sexToggleEl.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-sex]');
    if(!btn||btn.dataset.sex===currentSex) return;
    setSex(btn.dataset.sex);
  });

  function renderOrganList(filter){
    const q=(filter||'').trim().toLowerCase();
    organsListEl.innerHTML='';
    ORGANS.forEach(org=>{
      if(org.id==='ReproductiveMale'&&currentSex!=='male') return;
      if(org.id==='ReproductiveFemale'&&currentSex!=='female') return;
      if(q&&!org.label.toLowerCase().includes(q)&&!org.system.toLowerCase().includes(q)) return;
      const row=document.createElement('div');
      row.className='organ-row'+(org.id===selectedOrganId?' active':'');
      row.dataset.organId=org.id;
      row.innerHTML='<span class="label">'+org.label+'</span><span class="badge">'+org.system+'</span>';
      row.addEventListener('click',()=>selectOrgan(org.id));
      organsListEl.appendChild(row);
    });
    if(!organsListEl.children.length)
      organsListEl.innerHTML='<div class="organ-row" style="justify-content:center;color:var(--text-muted);font-size:12px;padding:14px">No results</div>';
  }
  organSearchEl.addEventListener('input',()=>renderOrganList(organSearchEl.value));

  function renderDetail(){
    if(!selectedOrganId){organDetailEl.innerHTML='<div class="detail-placeholder">Select an organ on the diagram or from the list to see educational details.</div>';return;}
    const org=ORGAN_MAP[selectedOrganId];
    if(!org) return;
    organDetailEl.innerHTML=
      '<div class="detail-header"><h3>'+org.label+'</h3><span class="detail-system">'+org.system+'</span></div>'+
      '<p class="detail-summary">'+org.summary+'</p>'+
      '<div class="detail-more-toggle" id="moreToggle"><span>More details</span><span aria-hidden="true">&#9662;</span></div>'+
      '<div class="detail-more-body" id="moreBody">'+org.more+'</div>';
    document.getElementById('moreToggle').addEventListener('click',()=>{
      const body=document.getElementById('moreBody');
      const caret=document.querySelector('#moreToggle span[aria-hidden]');
      const open=body.classList.toggle('open');
      caret.innerHTML=open?'&#9652;':'&#9662;';
    });
  }

  function selectOrgan(organId){
    selectedOrganId=organId;
    svg.querySelectorAll('.organ').forEach(el=>el.classList.remove('selected'));
    svg.querySelectorAll('.organ-label-group').forEach(el=>el.classList.remove('selected-label'));
    if(organId){
      const el=svg.querySelector('.organ[data-organ="'+organId+'"]');
      if(el) el.classList.add('selected');
      const lbl=svg.querySelector('.organ-label-group[data-label="'+organId+'"]');
      if(lbl) lbl.classList.add('selected-label');
    }
    document.querySelectorAll('.organ-row').forEach(el=>el.classList.toggle('active',el.dataset.organId===organId));
    renderDetail();
  }

  svg.querySelectorAll('.organ[data-organ]').forEach(el=>{
    el.addEventListener('click',()=>selectOrgan(el.dataset.organ===selectedOrganId?null:el.dataset.organ));
  });
  svg.querySelectorAll('.organ-label-group[data-label]').forEach(el=>{
    el.addEventListener('click',()=>{const id=el.dataset.label;if(id) selectOrgan(id===selectedOrganId?null:id);});
  });

  setSex('male');
  renderOrganList();
  renderDetail();
  </script>
</body>
</html>
