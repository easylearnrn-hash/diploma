<!DOCTYPE html>
<html>
<head>
  <title>Password Hash Tester</title>
</head>
<body>
  <h1>Password Hash Tester</h1>
  <p>Username: narine.avetisyan.3251</p>
  <p>Password from screenshot: Ff89C52BgA5a</p>
  
  <button onclick="testHash()">Test Hash</button>
  
  <div id="result"></div>
  
  <script>
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    async function testHash() {
      const password = 'Ff89C52BgA5a';
      const hash = await hashPassword(password);
      
      document.getElementById('result').innerHTML = `
        <h3>Results:</h3>
        <p><strong>Password:</strong> ${password}</p>
        <p><strong>SHA-256 Hash:</strong> ${hash}</p>
        <p><strong>Hash Length:</strong> ${hash.length}</p>
        <p style="background: yellow; padding: 10px;">
          <strong>Copy this hash and compare it with the database:</strong><br>
          <textarea style="width: 100%; height: 60px;">${hash}</textarea>
        </p>
      `;
    }
  </script>
</body>
</html>
