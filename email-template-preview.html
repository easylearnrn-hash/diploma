<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACNHS Email Template Preview</title>
  <script src="./Final-ACNHS-Logo.js"></script>
  <script>
    // Fallback if Final-ACNHS-Logo.js fails to load (e.g., when previewing from a remote origin)
    if (typeof window.ACNHS_LOGO_EMAIL_URL === 'undefined') {
      window.ACNHS_LOGO_EMAIL_URL = 'https://raw.githubusercontent.com/easylearnrn-hash/diploma/main/assets/images/Seal.png';
    }
    if (typeof window.ACNHS_LOGO_BASE64 === 'undefined') {
      window.ACNHS_LOGO_BASE64 = window.ACNHS_LOGO_EMAIL_URL;
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      font-family: 'Inter', Arial, sans-serif;
    }
    .preview-container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #2dd4bf;
      text-align: center;
      margin-bottom: 30px;
    }
    .template-wrapper {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h1>📧 ACNHS Email Template</h1>
    <div class="template-wrapper" id="emailPreview">
      <!-- Email template will be rendered here -->
    </div>
  </div>

  <script>
    // The EXACT email template from email-system.html
    const EMAIL_HTML_TEMPLATE = `<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{SUBJECT}}</title>
  <style>
    html,body{margin:0!important;padding:0!important;height:100%!important;width:100%!important}
    *{-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%}
    table,td{mso-table-lspace:0pt!important;mso-table-rspace:0pt!important;border-collapse:collapse!important}
    img{-ms-interpolation-mode:bicubic;border:0;outline:none;text-decoration:none;display:block}
    a{color:inherit;text-decoration:none}
    .u-link{color:#2dd4bf!important;text-decoration:underline!important}
    @media (max-width: 620px){
      .container{width:100%!important}
      .px{padding-left:18px!important;padding-right:18px!important}
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f8fafc;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;">
    <tr>
      <td align="center" style="padding:24px 10px;">
        <table role="presentation" width="600" class="container" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;">
          <tr>
            <td style="background:#0a2540;border-left:1px solid rgba(2,6,23,0.08);border-right:1px solid rgba(2,6,23,0.08);border-radius:14px 14px 0 0;padding:20px 26px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="68" valign="middle">
                    <img src="{{ACNHS_SEAL_BASE64}}" width="54" height="54" alt="ACNHS" style="border-radius:999px;background:rgba(255,255,255,0.10);padding:6px;">
                  </td>
                  <td valign="middle" style="padding-left:14px;">
                    <div style="font-family:Inter,Arial,sans-serif;font-size:16px;color:#ffffff;font-weight:800;">Armenian College of Nursing</div>
                    <div style="font-family:Inter,Arial,sans-serif;font-size:15px;color:#ffffff;font-weight:700;opacity:0.96;">&amp; Health Sciences</div>
                    <div style="font-family:Inter,Arial,sans-serif;font-size:12px;color:#cbd5e1;font-weight:600;margin-top:6px;">Yerevan, Armenia</div>
                  </td>
                  <td valign="top" align="right" style="padding-left:14px;">
                    {{STUDENT_INFO}}
                  </td>
                </tr>
              </table>
              <div style="height:1px;background:rgba(255,255,255,0.10);margin:16px 0;"></div>
              <div style="font-family:Inter,Arial,sans-serif;font-size:26px;color:#ffffff;font-weight:900;letter-spacing:-0.4px;">{{EMAIL_TITLE}}</div>
              <div style="font-family:Inter,Arial,sans-serif;font-size:13px;color:#94a3b8;font-weight:600;margin-top:6px;">{{DATE}}</div>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border-left:1px solid rgba(2,6,23,0.08);border-right:1px solid rgba(2,6,23,0.08);padding:26px;">
              <div style="font-family:Inter,Arial,sans-serif;font-size:17px;color:#0f172a;font-weight:800;">Dear {{APPLICANT_NAME}},</div>
              <div style="font-family:Inter,Arial,sans-serif;font-size:15px;line-height:23px;color:#334155;margin-top:12px;">{{BODY_CONTENT}}</div>
              <div style="font-family:Inter,Arial,sans-serif;font-size:15px;color:#0f172a;font-weight:800;margin-top:24px;">Respectfully,</div>
              <div style="margin-top:12px;">
                <table style="border:none;padding:0;margin:0;line-height:1.3;font-family:Arial,sans-serif;">
                  <tr>
                    <td style="padding:2px 8px 2px 2px;vertical-align:middle;">
                      <img src="{{ACNHS_SEAL_BASE64}}" width="70" height="70" alt="ACNHS Seal" style="display:block;border:none;">
                    </td>
                    <td style="padding:2px;vertical-align:middle;">
                      <div style="font-size:15px;font-weight:900;color:#0f172a;margin-bottom:2px;">Admissions Officer</div>
                      <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:4px;">Admissions Department</div>
                      <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:3px;">Armenian College of Nursing & Health Sciences</div>
                      <div style="font-size:11px;color:#94a3b8;margin-bottom:6px;">Yerevan, Armenia</div>
                      <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0;padding:0;">
                        <tr>
                          <td style="font-size:11px;color:#64748b;padding:0 6px 4px 0;white-space:nowrap;">📞</td>
                          <td style="font-size:11px;color:#64748b;padding:0 0 4px 0;white-space:nowrap;">+374 93 798879</td>
                        </tr>
                        <tr>
                          <td style="font-size:11px;color:#2563eb;padding:0 6px 4px 0;white-space:nowrap;">📧</td>
                          <td style="font-size:11px;color:#2563eb;padding:0 0 4px 0;white-space:nowrap;">admissions@acnhs.am</td>
                        </tr>
                        <tr>
                          <td style="font-size:11px;color:#2563eb;padding:0 6px 0 0;white-space:nowrap;">🌐</td>
                          <td style="font-size:11px;color:#2563eb;padding:0;white-space:nowrap;">www.acnhs.am</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </div>
            </td>
          </tr>
          <tr>
            <td style="background:#020617;border-radius:0 0 14px 14px;padding:16px 26px;">
              <div style="font-family:Inter,Arial,sans-serif;font-size:12px;color:#94a3b8;">© {{YEAR}} Armenian College of Nursing &amp; Health Sciences</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>`;

    // Sample data to populate the template
    const sampleData = {
      subject: 'Application Status Update - ACNHS',
      emailTitle: 'Application Status Update',
      date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      applicantName: 'John Doe',
      bodyContent: `Your application status has been updated. Please review the information below:
        
        <div style="background:#f0fdfa;border-left:3px solid #0d9488;padding:16px;border-radius:8px;margin:20px 0;">
          <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0 0 8px 0;padding:0;">
            <tr>
              <td style="font-size:18px;padding:0 10px 0 0;vertical-align:top;white-space:nowrap;">📋</td>
              <td style="font-size:15px;font-weight:800;color:#0f172a;white-space:nowrap;">New Status: Under Review</td>
            </tr>
          </table>
          <div style="font-size:14px;color:#475569;line-height:22px;">Your application is currently being reviewed by our admissions committee. We will notify you of any updates.</div>
        </div>
        
        <div style="background:#f8fafc;padding:14px;border-radius:8px;margin:16px 0;">
          <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:4px;">REFERENCE NUMBER</div>
          <div style="font-size:14px;font-weight:800;color:#0f172a;">ACNHS-2026-0001</div>
        </div>
        
        <div style="height:1px;background:#e2e8f0;margin:24px 0;"></div>
        
        To view complete details about your application and access your student portal, please log in:
        
        <div style="text-align:center;margin:24px 0;">
          <a href="#" style="display:inline-block;background:linear-gradient(135deg,#2dd4bf 0%,#0d9488 100%);color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:8px;font-weight:700;font-size:14px;box-shadow:0 4px 12px rgba(45,212,191,0.3);">
            <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0;padding:0;">
              <tr>
                <td style="font-size:18px;padding:0 8px 0 0;color:#ffffff;white-space:nowrap;">🔐</td>
                <td style="font-size:14px;font-weight:700;color:#ffffff;white-space:nowrap;">Log In to View Details</td>
              </tr>
            </table>
          </a>
        </div>
        
        <div style="background:#f8fafc;padding:14px;border-radius:8px;margin-top:20px;border:1px solid #e2e8f0;">
          <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0;padding:0;">
            <tr>
              <td style="font-size:18px;padding:0 10px 0 0;vertical-align:top;white-space:nowrap;">💡</td>
              <td style="font-size:13px;color:#64748b;line-height:20px;">
                <strong style="color:#475569;">Tip:</strong> Use your username and password that was provided to you after submittion of application. If you've forgotten your credentials, please contact our admissions office.
              </td>
            </tr>
          </table>
        </div>`,
      studentInfo: '',
      year: new Date().getFullYear()
    };

    // Populate the template with sample data
    let html = EMAIL_HTML_TEMPLATE
      .replace(/{{SUBJECT}}/g, sampleData.subject)
      .replace(/{{EMAIL_TITLE}}/g, sampleData.emailTitle)
      .replace(/{{DATE}}/g, sampleData.date)
      .replace(/{{APPLICANT_NAME}}/g, sampleData.applicantName)
      .replace(/{{BODY_CONTENT}}/g, sampleData.bodyContent)
      .replace(/{{STUDENT_INFO}}/g, sampleData.studentInfo)
      .replace(/{{YEAR}}/g, sampleData.year);

    // Replace the logo placeholder with hosted URL (preferred) or base64 fallback
    const hostedLogo = (typeof ACNHS_LOGO_EMAIL_URL !== 'undefined' && ACNHS_LOGO_EMAIL_URL) ? ACNHS_LOGO_EMAIL_URL : null;
    const inlineLogo = (typeof ACNHS_LOGO_BASE64 !== 'undefined' && ACNHS_LOGO_BASE64) ? ACNHS_LOGO_BASE64 : null;
    const logoSource = hostedLogo || inlineLogo || '';

    if (logoSource) {
      html = html.replace(/{{ACNHS_SEAL_BASE64}}/g, logoSource);
    } else {
      console.warn('⚠️ ACNHS logo not available for preview');
      html = html.replace(/{{ACNHS_SEAL_BASE64}}/g, '');
    }

    // Display the email
    document.getElementById('emailPreview').innerHTML = html;
  </script>
</body>
</html>
